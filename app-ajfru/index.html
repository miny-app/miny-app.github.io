<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>적금벽돌쌓기</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <h1>🧱 적금벽돌쌓기</h1>

  <div class="year-nav">
    <button class="nav" id="prevYear" aria-label="이전 연도">‹</button>
    <b id="yearLabel">2026</b>
    <button class="nav" id="nextYear" aria-label="다음 연도">›</button>
  </div>

  <section class="card">
    <div class="pct" id="pctTxt">0%</div>
    <div class="wall" id="wall"></div>
    <div class="ground"></div>
    <div class="sum">
      <b id="savedTxt">0원</b>
      <span>/</span>
      <input id="goalInput" inputmode="numeric" placeholder="목표 금액" autocomplete="off">
      <span>원</span>
    </div>
    <div class="dep-row">
      <input id="amountInput" inputmode="numeric" placeholder="저금한 금액" autocomplete="off">
      <button id="addBtn">쌓기</button>
    </div>
  </section>

  <div class="houses" id="houses"></div>

  <details class="fold">
    <summary>저금 기록</summary>
    <ul id="historyList"></ul>
  </details>

  <footer class="slogan">💲 10년동안 함께해요 💲</footer>
</main>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
