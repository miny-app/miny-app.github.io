<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>벽돌적금</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #2b2b2b;
    --muted: #9a9a9a;
    --soft: #f4f1ec;
    --wood: #e2a865;
    --wood-d: #c98c4a;
    --accent: #e0703d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 28px 20px 40px; }

  h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

  /* 요약 */
  .summary { text-align: center; margin: 22px 0 6px; }
  .pct { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1; }
  .amounts { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .amounts b { color: var(--ink); }
  .goal-link { background: none; border: none; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; font-family: inherit; margin-top: 6px; }
  .bar { height: 4px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 16px 0 0; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .6s ease; }

  /* 타워 + 양쪽 집 */
  .stage {
    display: flex; justify-content: center; align-items: flex-end; gap: 14px;
    margin-top: 30px;
  }
  .side { display: flex; flex-direction: column-reverse; gap: 10px; width: 38px; }
  .mini { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: default; }
  .mini .mroof {
    width: 0; height: 0;
    border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-bottom: 8px solid #eee;
  }
  .mini .mb { width: 26px; height: 4px; border-radius: 1px; background: #eee; }
  .mini .mb:nth-child(odd) { transform: translateX(1px); }
  .mini .mb:nth-child(even) { transform: translateX(-1px); }
  .mini .mn { font-size: 10px; color: #ccc; margin-top: 2px; }
  .mini.on { cursor: pointer; }
  .mini.on .mroof { border-bottom-color: #d9534f; }
  .mini.on .mb { background: var(--wood); }
  .mini.on .mn { color: var(--ink); font-weight: 700; }

  .tower { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
  .layer { display: flex; gap: 3px; width: 180px; height: 20px; }
  .layer.odd { transform: translateX(3px); }
  .layer.even { transform: translateX(-3px); }
  .brick { flex: 1; border-radius: 3px; position: relative; overflow: hidden; background: var(--soft); }
  .brick .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--wood); transition: width .5s ease; }
  .layer.even .brick .fill { background: var(--wood-d); }
  .brick.drop { animation: drop .5s cubic-bezier(.3,1.4,.6,1); }
  @keyframes drop { from { transform: translateY(-50px); opacity: 0; } to { transform: none; opacity: 1; } }
  .roof {
    width: 0; height: 0; margin-bottom: 2px; order: 999;
    border-left: 100px solid transparent; border-right: 100px solid transparent;
    border-bottom: 34px solid #d9534f; opacity: 0; transition: opacity .6s;
  }
  .roof.show { opacity: 1; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* 입금 */
  .add { margin-top: 30px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 13px 14px; border-radius: 12px; border: none;
    font-size: 16px; background: var(--soft); color: var(--ink); outline: none; font-family: inherit;
  }
  button {
    border: none; border-radius: 12px; padding: 13px 18px; font-size: 15px; font-weight: 700;
    background: var(--ink); color: #fff; cursor: pointer; font-family: inherit;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .3; }
  .quick { display: flex; gap: 6px; margin-top: 8px; }
  .quick button { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 600; background: var(--soft); color: var(--ink); }
  .memo { margin-top: 8px; width: 100%; }

  /* 기록 */
  .history { list-style: none; padding: 0; margin: 28px 0 0; }
  .history li { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
  .history .d { color: var(--muted); font-size: 12px; width: 40px; flex-shrink: 0; }
  .history .m { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #666; }
  .history .a { font-weight: 700; }
  .history .x { background: none; color: #ccc; padding: 0 4px; font-size: 16px; font-weight: 400; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; }

  .slogan { text-align: center; margin-top: 40px; font-size: 16px; font-weight: 800; }
  .reset { display: block; margin: 14px auto 0; background: none; color: #ccc; font-size: 12px; font-weight: 400; padding: 4px; }

  /* 모달 */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal.show { display: flex; }
  .modal .box { background: #fff; border-radius: 18px; padding: 24px 20px 20px; width: 100%; max-width: 340px; text-align: center; }
  .modal h3 { margin: 0 0 8px; font-size: 19px; }
  .modal p { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.6; }
  .modal input { width: 100%; }
  .modal .btns { display: flex; gap: 8px; margin-top: 12px; }
  .modal .btns button { flex: 1; }
  .modal .btns .ghost { background: var(--soft); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>벽돌적금</h1>

  <section class="summary">
    <div class="pct" id="sPct">0%</div>
    <div class="amounts"><b id="sSaved">0원</b> / <span id="sGoal">0원</span></div>
    <button class="goal-link" id="goalBtn">목표 바꾸기</button>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <section class="stage">
    <div class="side" id="leftSide"></div>
    <div class="tower" id="tower"></div>
    <div class="side" id="rightSide"></div>
  </section>
  <div class="hint" id="hint"></div>

  <section class="add">
    <div class="row">
      <input id="amt" type="text" inputmode="numeric" placeholder="금액 (원)" />
      <button id="addBtn">쌓기</button>
    </div>
    <div class="quick">
      <button data-q="10000">+1만</button>
      <button data-q="50000">+5만</button>
      <button data-q="100000">+10만</button>
      <button data-q="0">지우기</button>
    </div>
    <input class="memo" id="memo" type="text" placeholder="메모 (선택)" maxlength="30" />
  </section>

  <ul class="history" id="history"></ul>

  <footer class="slogan">💵 10년 동안 함께 저금해요 💵</footer>
  <button class="reset" id="resetBtn">전체 초기화</button>
</div>

<div class="modal" id="goalModal">
  <div class="box">
    <h3>올해 목표금액</h3>
    <p>목표를 다 채우면 집 한 채가 완성돼요.</p>
    <input id="goalInput" type="text" inputmode="numeric" placeholder="예: 12,000,000" />
    <div class="btns">
      <button class="ghost" id="goalCancel">취소</button>
      <button id="goalSave">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="doneModal">
  <div class="box">
    <h3 id="doneTitle">집 완성!</h3>
    <p id="doneText"></p>
    <div class="btns">
      <button class="ghost" id="doneLater">나중에</button>
      <button id="doneOk">완성하기</button>
    </div>
  </div>
</div>

<div class="modal" id="infoModal">
  <div class="box">
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
    <div class="btns"><button id="infoOk">닫기</button></div>
  </div>
</div>

<script>
(function () {
  const KEY = 'app-qqps0:state';
  const LAYERS = 12;
  const PER = 3;
  const TOTAL = LAYERS * PER;
  const MAX_HOUSES = 10;

  const $ = (id) => document.getElementById(id);
  const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
  const parseNum = (s) => Number(String(s).replace(/[^\d]/g, '')) || 0;

  let state = load();
  let prevFilled = filledBricks();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object') {
        return { goal: s.goal || 0, deposits: s.deposits || [], houses: s.houses || [], startedAt: s.startedAt || Date.now() };
      }
    } catch (e) {}
    return { goal: 0, deposits: [], houses: [], startedAt: Date.now() };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  function savedSum() { return state.deposits.reduce((a, d) => a + d.amount, 0); }
  function filledBricks() {
    if (!state.goal) return 0;
    return Math.min(TOTAL, (savedSum() / state.goal) * TOTAL);
  }
  function allDone() { return state.houses.length >= MAX_HOUSES; }
  function fmtDate(t) { const d = new Date(t); return (d.getMonth() + 1) + '.' + d.getDate(); }
  function fmtFull(t) { const d = new Date(t); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); }

  // 메인 타워
  const tower = $('tower');
  const bricks = [];
  for (let l = 0; l < LAYERS; l++) {
    const layer = document.createElement('div');
    layer.className = 'layer ' + (l % 2 === 0 ? 'odd' : 'even');
    for (let b = 0; b < PER; b++) {
      const br = document.createElement('div');
      br.className = 'brick';
      br.innerHTML = '<div class="fill"></div>';
      layer.appendChild(br);
      bricks.push(br);
    }
    tower.appendChild(layer);
  }
  const roof = document.createElement('div');
  roof.className = 'roof';
  tower.appendChild(roof);

  // 양쪽 미니 젠가 (왼쪽 1~5, 오른쪽 6~10, 아래에서 위로)
  function miniHTML(i) {
    return '<div class="mroof"></div>' + '<div class="mb"></div>'.repeat(5) + `<div class="mn">${i + 1}</div>`;
  }
  function renderSides() {
    const L = $('leftSide'), R = $('rightSide');
    L.innerHTML = ''; R.innerHTML = '';
    for (let i = 0; i < MAX_HOUSES; i++) {
      const hs = state.houses[i];
      const el = document.createElement('div');
      el.className = 'mini' + (hs ? ' on' : '');
      el.innerHTML = miniHTML(i);
      if (hs) {
        el.onclick = () => {
          $('infoTitle').textContent = `${i + 1}번째 집`;
          $('infoText').innerHTML = `모은 금액 <b>${won(hs.saved)}</b><br/>${fmtFull(hs.startedAt)} ~ ${fmtFull(hs.doneAt)}`;
          $('infoModal').classList.add('show');
        };
      }
      (i < 5 ? L : R).appendChild(el);
    }
  }

  function render(animate) {
    const goal = state.goal;
    const saved = savedSum();
    const pct = goal ? Math.min(100, (saved / goal) * 100) : 0;

    $('sPct').textContent = (pct >= 100 ? 100 : Math.floor(pct * 10) / 10) + '%';
    $('sSaved').textContent = won(saved);
    $('sGoal').textContent = goal ? won(goal) : '목표 미설정';
    $('bar').style.width = pct + '%';

    $('hint').textContent = allDone()
      ? '10채 모두 완성! 🎉'
      : goal ? `${state.houses.length + 1}번째 집 · 벽돌 1개 = ${won(goal / TOTAL)}` : '';

    const filled = filledBricks();
    bricks.forEach((br, i) => {
      const frac = Math.max(0, Math.min(1, filled - i));
      br.firstChild.style.width = (frac * 100) + '%';
      if (frac >= 1 && animate && i >= Math.floor(prevFilled)) {
        br.classList.remove('drop'); void br.offsetWidth; br.classList.add('drop');
      }
    });
    roof.classList.toggle('show', goal > 0 && saved >= goal);
    prevFilled = filled;

    renderSides();

    const h = $('history');
    h.innerHTML = '';
    if (!state.deposits.length) {
      h.innerHTML = '<li class="empty" style="justify-content:center">아직 쌓은 벽돌이 없어요</li>';
    } else {
      [...state.deposits].reverse().forEach((d) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="d">${fmtDate(d.at)}</span><span class="m"></span><span class="a">+${won(d.amount)}</span><button class="x" title="삭제">×</button>`;
        li.querySelector('.m').textContent = d.memo || '';
        li.querySelector('.x').onclick = () => {
          if (confirm('이 기록을 삭제할까요?')) {
            state.deposits = state.deposits.filter((x) => x.id !== d.id);
            save(); render(false);
          }
        };
        h.appendChild(li);
      });
    }

    $('addBtn').disabled = allDone();
  }

  function checkDone() {
    if (allDone() || !state.goal) return;
    if (savedSum() >= state.goal) {
      const n = state.houses.length + 1;
      $('doneTitle').textContent = `${n}번째 집 완성! 🎉`;
      $('doneText').innerHTML = `목표 ${won(state.goal)}을 모두 모았어요.<br/>완성한 집은 옆에 세워 두고 다음 집을 지어요.`;
      setTimeout(() => $('doneModal').classList.add('show'), 700);
    }
  }

  function addDeposit() {
    if (allDone()) return;
    if (!state.goal) { openGoal(); return; }
    const amount = parseNum($('amt').value);
    if (!amount) { $('amt').focus(); return; }
    state.deposits.push({ id: Date.now() + Math.random(), amount, memo: $('memo').value.trim(), at: Date.now() });
    $('amt').value = ''; $('memo').value = '';
    save(); render(true); checkDone();
  }

  function commaInput(el) {
    el.addEventListener('input', () => {
      const n = parseNum(el.value);
      el.value = n ? n.toLocaleString('ko-KR') : '';
    });
  }
  commaInput($('amt')); commaInput($('goalInput'));

  $('addBtn').onclick = addDeposit;
  $('amt').addEventListener('keydown', (e) => { if (e.key === 'Enter') addDeposit(); });
  $('memo').addEventListener('keydown', (e) => { if (e.key === 'Enter') addDeposit(); });
  document.querySelectorAll('.quick button').forEach((b) => {
    b.onclick = () => {
      const q = Number(b.dataset.q);
      const v = q ? parseNum($('amt').value) + q : 0;
      $('amt').value = v ? v.toLocaleString('ko-KR') : '';
    };
  });

  function openGoal() {
    $('goalInput').value = state.goal ? state.goal.toLocaleString('ko-KR') : '';
    $('goalModal').classList.add('show');
    setTimeout(() => $('goalInput').focus(), 50);
  }
  $('goalBtn').onclick = openGoal;
  $('goalCancel').onclick = () => $('goalModal').classList.remove('show');
  $('goalSave').onclick = () => {
    const g = parseNum($('goalInput').value);
    if (!g) { $('goalInput').focus(); return; }
    state.goal = g;
    save(); $('goalModal').classList.remove('show'); render(true); checkDone();
  };
  $('goalInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('goalSave').click(); });

  $('doneLater').onclick = () => $('doneModal').classList.remove('show');
  $('doneOk').onclick = () => {
    state.houses.push({ goal: state.goal, saved: savedSum(), startedAt: state.startedAt, doneAt: Date.now() });
    state.deposits = [];
    state.startedAt = Date.now();
    prevFilled = 0;
    save();
    $('doneModal').classList.remove('show');
    render(false);
  };
  $('infoOk').onclick = () => $('infoModal').classList.remove('show');

  $('resetBtn').onclick = () => {
    if (confirm('모든 기록과 완성한 집이 삭제됩니다. 초기화할까요?')) {
      state = { goal: 0, deposits: [], houses: [], startedAt: Date.now() };
      prevFilled = 0; save(); render(false); openGoal();
    }
  };

  document.querySelectorAll('.modal').forEach((m) => {
    m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show'); });
  });

  render(false);
  if (!state.goal) openGoal();
  else checkDone();
})();
</script>
</body>
</html>
