<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>적금벽돌쌓기</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>🧱 적금벽돌쌓기</h1>
    <div class="year-nav">
      <button class="nav" id="prevYear" aria-label="이전 연도">‹</button>
      <span class="year"><b id="yearLabel">2026</b>년 <small id="yearIndex">1년차</small></span>
      <button class="nav" id="nextYear" aria-label="다음 연도">›</button>
    </div>
  </header>

  <!-- 벽돌 벽 -->
  <section class="wall-card">
    <div class="pct" id="pctTxt">0%</div>
    <div class="wall" id="wall"></div>
    <div class="ground"></div>
    <div class="sum">
      <span>모은 돈 <b id="savedTxt">0원</b></span>
      <span>남은 돈 <b id="remainTxt">0원</b></span>
    </div>
  </section>

  <!-- 저금 입력 -->
  <section class="card">
    <div class="dep-row">
      <input id="amountInput" inputmode="numeric" placeholder="저금한 금액" autocomplete="off">
      <button id="addBtn" class="add-btn">쌓기</button>
    </div>
    <div class="quick">
      <button data-q="10000">+1만</button>
      <button data-q="50000">+5만</button>
      <button data-q="100000">+10만</button>
      <button data-q="0" class="clear">지우기</button>
    </div>
    <label class="goal-row">
      <span>올해 목표</span>
      <input id="goalInput" inputmode="numeric" placeholder="예: 3,000,000" autocomplete="off">
      <span>원</span>
    </label>
  </section>

  <!-- 10년 벽돌집 -->
  <section class="card">
    <div class="sec-title">10년 벽돌집 <b id="badgeCount">0</b>/10</div>
    <div class="houses" id="houses"></div>
  </section>

  <details class="card fold">
    <summary><span id="histYear">2026</span>년 저금 기록</summary>
    <ul id="historyList"></ul>
    <p class="empty" id="historyEmpty">아직 쌓은 벽돌이 없어요.</p>
  </details>

  <details class="card fold">
    <summary>설정</summary>
    <label class="setting">시작 연도
      <select id="startYear"></select>
    </label>
  </details>

  <footer class="slogan">💲 10년동안 함께해요 💲</footer>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-house" id="modalHouse"></div>
    <h3>벽돌집 완공!</h3>
    <p id="modalMsg"></p>
    <button id="modalClose" class="add-btn">좋아요</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
