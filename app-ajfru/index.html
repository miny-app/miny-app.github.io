<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>적금벽돌쌓기</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <h1 class="name">적금벽돌쌓기</h1>

  <section class="pillars" id="pillars"></section>

  <section class="panel">
    <div class="info">
      <b id="yearLabel">2026년</b>
      <span id="pctTxt">0%</span>
    </div>
    <div class="sum">
      <b id="savedTxt">0원</b>
      <span>/</span>
      <input id="goalInput" inputmode="numeric" placeholder="목표 금액" autocomplete="off">
      <span>원</span>
    </div>
    <div class="dep-row">
      <input id="amountInput" inputmode="numeric" placeholder="저금한 금액" autocomplete="off">
      <button id="addBtn">쌓기</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">되돌리기</button></div>

<script src="./app.js"></script>
</body>
</html>
