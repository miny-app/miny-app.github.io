<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도토리곳간</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#191f28; --sub:#8b95a1; --line:#eef0f3; --soft:#f6f7f9;
    --brand:#4f6bed; --brand-soft:#eef1fe;
    --under:#1c7ed6; --under-soft:#e7f2fc;   /* 부족(▼) 파랑 */
    --over:#e03131;  --over-soft:#fdeaea;    /* 초과(▲) 빨강 */
    --good:#0ca678;  --good-soft:#e3f7ef;    /* 적정·달성 초록 */
    --mid:#f08c00;   --mid-soft:#fff4e0;     /* 진행 중 주황 */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 16px}
  h1{font-size:22px;margin:0;letter-spacing:-.6px;font-weight:800}
  h1 span{color:var(--brand)}
  .muted{color:var(--sub);font-size:13px}

  /* 탭 */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:none;background:#fff;color:var(--sub);padding:9px 15px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:700}
  .tab.on{background:var(--text);color:#fff}
  .tab.add{background:transparent;color:var(--brand)}

  /* 카드 */
  .card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:12px}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .card-h h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

  /* 숫자 */
  .money{font-weight:800;letter-spacing:-.4px}
  .money small{font-size:.62em;font-weight:600;margin-left:2px;color:var(--sub)}
  .big{font-size:28px}
  .c-under{color:var(--under)} .c-over{color:var(--over)} .c-good{color:var(--good)} .c-mid{color:var(--mid)} .c-brand{color:var(--brand)} .c-sub{color:var(--sub)}

  /* 버튼 */
  .btn{border:none;background:var(--text);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.soft{background:var(--soft);color:var(--text)}
  .btn.brand{background:var(--brand-soft);color:var(--brand)}
  .btn.ghost{background:transparent;color:var(--sub);padding:6px 8px}
  .btn.danger{background:var(--over-soft);color:var(--over)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}

  /* 진행 막대 */
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 8px}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .4s}

  /* 통계 */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
  .stat{background:var(--soft);border-radius:12px;padding:11px 12px}
  .stat .l{font-size:12px;color:var(--sub);font-weight:600}
  .stat .v{display:block;font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.3px}

  /* 도넛 */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chart{text-align:center}
  .chart .title{font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:700}
  .chart svg{width:100%;max-width:200px;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend b{font-weight:700}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

  /* 100% 쌓기 막대 */
  .stack-wrap{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .stack-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 5px}
  .stack{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
  .stack i{height:100%;font-style:normal;font-size:11px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .stack i.rest{background:repeating-linear-gradient(45deg,#e6e9ee,#e6e9ee 5px,#f1f3f5 5px,#f1f3f5 10px);color:var(--sub)}

  /* 종목 */
  .stock{padding:16px 0;border-top:1px solid var(--line)}
  .stock:first-of-type{border-top:none;padding-top:2px}
  .stock .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;min-width:0}
  .stock .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stock .amt{margin-top:4px;font-size:18px}
  .wgrid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;margin-top:10px}
  .wgrid > div{background:var(--soft);border-radius:10px;padding:8px 10px}
  .wgrid .l{font-size:11px;color:var(--sub);font-weight:700}
  .wgrid .v{font-size:16px;font-weight:800;margin-top:1px;letter-spacing:-.3px}
  .wgrid .diff.under{background:var(--under-soft)} .wgrid .diff.over{background:var(--over-soft)} .wgrid .diff.ok{background:var(--good-soft)}
  .slot{position:relative;height:8px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
  .slot .t{position:absolute;top:0;bottom:0;opacity:.22}
  .slot .c{position:absolute;top:0;bottom:0}
  .slot .o{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.55),rgba(255,255,255,.55) 3px,transparent 3px,transparent 6px)}
  .slot-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
  .need{margin-top:8px;font-size:13px;color:var(--sub)}
  .need b{color:var(--under)}

  /* 범례 안내 */
  .key{display:flex;gap:12px;font-size:12px;color:var(--sub);margin:-4px 0 12px;flex-wrap:wrap}
  .key b{font-weight:800}

  .warn{background:var(--mid-soft);color:#b35c00;font-size:13px;padding:9px 12px;border-radius:10px;margin-top:12px;font-weight:600}
  .empty{text-align:center;color:var(--sub);padding:26px 0;font-size:14px}

  /* 자산 리스트 */
  .asset{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .asset:first-child{border-top:none}
  .asset .nm{display:flex;align-items:center;gap:8px;font-weight:700}
  .asset .nm em{font-style:normal;font-weight:500;color:var(--sub);font-size:12px}
  .asset .amt{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto}
  .asset .amt .money{text-align:right;font-variant-numeric:tabular-nums}
  .asset .nm{min-width:0;white-space:nowrap}
  .pctpill{font-size:12px;font-weight:800;background:var(--soft);padding:3px 7px;border-radius:6px;min-width:48px;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{border:none;background:var(--brand-soft);color:var(--brand);padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}

  /* 가족 현황 */
  .member{padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
  .member:first-of-type{border-top:none;padding-top:2px}
  .member .bar{margin:10px 0 6px;height:8px}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  @media(min-width:560px){.modal-bg{align-items:center}.modal{border-radius:22px}}
  .modal h3{margin:0 0 16px;font-size:18px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:700}
  input,select{width:100%;padding:12px 13px;border:1px solid #e1e4e9;border-radius:11px;font-size:16px;background:#fff;color:var(--text);font-family:inherit;font-variant-numeric:tabular-nums}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .modal .actions{display:flex;gap:8px;margin-top:18px}
  .modal .actions .btn{flex:1;padding:13px}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
  .alloc-sum{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:14px}
  .alloc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .alloc-row label{flex:1;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
  .alloc-row input{width:96px;text-align:right}

  .foot{display:flex;justify-content:center;gap:8px;margin-top:4px}

  /* 은퇴계획 */
  .chip.off{background:var(--soft);color:var(--sub);text-decoration:line-through}
  .chip .dot{margin-right:5px;vertical-align:-1px}
  .msg{border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px;font-weight:600;line-height:1.5}
  .msg.good{background:var(--good-soft);color:#087f5b}
  .msg.mid{background:var(--mid-soft);color:#b35c00}
  .msg.bad{background:var(--over-soft);color:var(--over)}
  .flow svg{width:100%;height:auto;display:block}

  /* 그래프 자세히 보기 */
  [data-act="chart"]{cursor:pointer;transition:opacity .15s}
  [data-act="chart"]:active{opacity:.7}
  .tap-hint{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}
  .detail-chart{text-align:center;margin:-4px 0 6px}
  .detail-chart svg{width:100%;max-width:240px;height:auto}
  .monthly{margin-top:12px;padding-top:10px;border-top:1px dashed #e1e4e9}
  .monthly .cap{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐿️ 도토리<span>곳간</span></h1>
    <span class="muted">여기저기 나눠 묻는 우리집 도토리</span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>

<div class="modal-bg" id="modalBg">
  <form class="modal" id="modal" autocomplete="off"></form>
</div>

<script>
const KEY = 'app-9nqq0:data';
/* 서로 확실히 구분되는 색만 사용 (비슷한 파랑·보라·초록 중복 제거) */
const COLORS = ['#4f6bed','#f59f00','#12b886','#e64980','#7950f2','#e03131','#15aabf','#82c91e','#a0522d','#868e96','#1c2a5a','#fcc419'];
const PRESETS = ['국민연금','부동산','현금','예적금','퇴직연금'];
const ASSET_COLORS = ['#22b8cf','#e8590c','#51cf66','#be4bdb','#f783ac','#868e96','#38d9a9','#fab005'];
const STOCK_COLOR = '#4f6bed';
const OK_RANGE = 1; // ±1%p 이내면 적정

let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.members)){ fixStockColors(s); return s; }
  }catch(e){}
  return { members:[{ id:uid(), name:'나', goalAmount:0, goalDate:'', stocks:[] }], selected:'all' };
}
/* 저장된 종목 색이 옛 팔레트이거나 같은 사람 안에서 겹치면 새 색으로 다시 배정 */
function fixStockColors(s){
  s.members.forEach(m=>{
    const used = [];
    (m.stocks||[]).forEach(st=>{
      if(!COLORS.includes(st.color) || used.includes(st.color)){
        st.color = COLORS.find(c=>!used.includes(c)) || COLORS[used.length%COLORS.length];
      }
      used.push(st.color);
    });
  });
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* 1억 이상: 1억1천5백만 형식 (만 원 미만은 반올림) */
function korChunk(v){
  const th = Math.floor(v/1000), hu = Math.floor(v%1000/100), rest = v%100;
  return (th?th+'천':'') + (hu?hu+'백':'') + (rest?rest:'');
}
function korBig(n){
  const neg = n < 0; let man = Math.round(Math.abs(n)/1e4);
  const jo = Math.floor(man/1e8), eok = Math.floor(man%1e8/1e4), m = man%1e4;
  const s = (jo?korChunk(jo)+'조':'') + (eok?korChunk(eok)+'억':'') + (m?korChunk(m)+'만':'');
  return (neg?'-':'') + s;
}
function plainOrKor(n){ n = Math.round(n||0); return Math.abs(n) >= 1e8 ? korBig(n) : n.toLocaleString('ko-KR'); }
function won(n){ return plainOrKor(n) + '원'; }
function shortWon(n){
  n = Math.round(n||0);
  if(Math.abs(n) >= 1e8) return korBig(n);
  if(Math.abs(n) >= 1e4){ return Math.round(n/1e4).toLocaleString('ko-KR') + '만'; }
  return n.toLocaleString('ko-KR');
}
/* 금액: 숫자 크게, '원'은 작게 */
function money(n, cls=''){ return `<span class="money ${cls}">${plainOrKor(n)}<small>원</small></span>`; }
function num(v){ const n = Number(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; }
function r1(n){ return Math.round(n*10)/10; }
function pct(n){ return r1(n) + '%'; }
function member(id){ return state.members.find(m=>m.id===id); }
function total(m){ return m.stocks.reduce((a,s)=>a+(s.principal||0),0); }
function targetSum(m){ return m.stocks.reduce((a,s)=>a+(s.target||0),0); }
function othersOf(m){ if(!Array.isArray(m.others)) m.others = []; return m.others; }

/* 달성률 색: 낮음 주황 → 70%↑ 파랑 → 100% 초록 */
function rateColor(r){ return r>=100 ? 'var(--good)' : r>=70 ? 'var(--brand)' : 'var(--mid)'; }
function rateCls(r){ return r>=100 ? 'c-good' : r>=70 ? 'c-brand' : 'c-mid'; }
/* 비중 차이 상태 */
function diffState(diff){ return Math.abs(diff) < OK_RANGE ? 'ok' : diff < 0 ? 'under' : 'over'; }
function diffText(diff){
  const st = diffState(diff);
  if(st==='ok') return `<span class="c-good">✓ 적정</span>`;
  if(st==='under') return `<span class="c-under">▼ ${r1(-diff)}%p</span>`;
  return `<span class="c-over">▲ ${r1(diff)}%p</span>`;
}

function monthsLeft(dateStr){
  if(!dateStr) return null;
  const now = new Date(); const d = new Date(dateStr+'T00:00:00');
  return (d.getFullYear()-now.getFullYear())*12 + (d.getMonth()-now.getMonth()) + (d.getDate()>=now.getDate()?0:-1);
}
function periodText(dateStr){
  const m = monthsLeft(dateStr);
  if(m===null) return '-';
  if(m<0) return '기간 종료';
  const y = Math.floor(m/12), r = m%12;
  return (y? y+'년 ':'') + (r||!y? r+'개월':'');
}

/* ---------- 도넛 차트 ---------- */
function donut(items, centerTop, centerBottom){
  const sum = items.reduce((a,i)=>a+i.value,0);
  const r = 70, C = 2*Math.PI*r;
  let off = 0, segs = '';
  if(sum>0){
    items.forEach(it=>{
      if(it.value<=0) return;
      const len = it.value/sum*C;
      segs += `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${it.color}" stroke-width="26"
        stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
      off += len;
    });
  }
  return `<svg viewBox="0 0 200 200">
    <circle r="${r}" cx="100" cy="100" fill="none" stroke="#eef0f3" stroke-width="26"/>
    ${segs}
    <text x="100" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#8b95a1">${esc(centerTop)}</text>
    <text x="100" y="118" text-anchor="middle" font-size="21" font-weight="800" fill="#191f28">${esc(centerBottom)}</text>
  </svg>`;
}

/* ---------- 그래프 자세히 보기 ---------- */
let chartReg = {};
function chartAttr(key, spec){ chartReg[key] = spec; return `data-act="chart" data-id="${key}" title="눌러서 자세히 보기"`; }
function openDetail(spec){
  const items = spec.items.filter(it=>it.value>0 || it.keep).sort((a,b)=>(b.order??b.value)-(a.order??a.value));
  const sum = items.reduce((a,it)=>a+it.value,0);
  modal.innerHTML = `<h3>${esc(spec.title)}</h3>
    <div class="detail-chart">${donut(items, spec.center[0], spec.center[1])}</div>
    ${spec.note?`<div class="muted" style="text-align:center;margin-bottom:8px">${esc(spec.note)}</div>`:''}
    <div>${items.length ? items.map(it=>`<div class="asset">
      <span class="nm"><i class="dot" style="background:${it.color}"></i><span style="overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</span>${it.sub?` <em>${esc(it.sub)}</em>`:''}</span>
      <span class="amt">${it.main||''}<span class="pctpill" style="color:${it.color==='#dfe3e8'?'var(--sub)':it.color}">${spec.rawPct?pct(it.value):sum>0?pct(it.value/sum*100):'-'}</span></span>
    </div>`).join('') : '<div class="empty">표시할 항목이 없어요</div>'}</div>
    <div class="actions"><button type="button" class="btn" data-mact="cancel">닫기</button></div>`;
  onSubmit = null; modal._extra = null; modal._allocAct = null;
  modalBg.classList.add('show');
}

/* ---------- 전체 자산 현황 ---------- */
/* 국민연금은 '월 수령액'으로 입력 → 총 자산 합계에서 제외하고 따로 표시 */
function isMonthly(o){ return String(o.name||'').trim()==='국민연금'; }
function assetsCard(stockSum, allItems, editable){
  const items = allItems.filter(o=>!isMonthly(o));
  const monthly = allItems.filter(isMonthly);
  const otherSum = items.reduce((a,o)=>a+(o.amount||0),0);
  const all = stockSum + otherSum;
  /* 주식은 '현금' 바로 아래, 현금이 없으면 맨 아래 */
  const stockPart = {name:'주식', amount:stockSum, color:STOCK_COLOR, isStock:true};
  const cashIdx = items.findIndex(o=>String(o.name).trim()==='현금');
  const parts = cashIdx>=0
    ? [...items.slice(0,cashIdx+1), stockPart, ...items.slice(cashIdx+1)]
    : [...items, stockPart];
  const used = allItems.map(o=>o.name);
  const presets = PRESETS.filter(p=>!used.includes(p));
  const spec = {title:'전체 자산 비중', center:['총 자산', shortWon(all)],
    items: parts.map(p=>({name:p.name, color:p.color, value:p.amount||0, main:money(p.amount||0)}))};
  return `<div class="card">
    <div class="card-h"><h2>전체 자산</h2>${editable?'<button class="btn brand sm" data-act="addOther">+ 자산 추가</button>':''}</div>
    <div class="muted">총 자산</div>
    <div class="big">${money(all)}</div>
    <div class="stack" style="margin-top:14px" ${all>0?chartAttr('assets', spec):''}>${all>0 ? parts.filter(p=>p.amount>0).map(p=>{const w=p.amount/all*100;return `<i style="width:${w}%;background:${p.color}" title="${esc(p.name)} ${pct(w)}">${w>=12?esc(p.name.slice(0,5)):''}</i>`;}).join('') : '<i class="rest" style="width:100%">자산 없음</i>'}</div>
    <div style="margin-top:8px">
      ${parts.map(p=>`<div class="asset">
        <span class="nm"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}${p.isStock?' <em>종목 합계</em>':''}</span>
        <span class="amt">${money(p.amount)}<span class="pctpill" style="color:${p.color}">${all>0?pct(p.amount/all*100):'-'}</span>

/* ---------- 목표 원금 ---------- */
function goalCard(cur, goalAmount, goalDate, editable){
  const has = goalAmount>0;
  const rateRaw = has ? cur/goalAmount*100 : 0;
  const rate = Math.min(100, rateRaw);
  const remain = Math.max(0, goalAmount - cur);
  return `<div class="card">
    <div class="card-h"><h2>목표 원금</h2>${editable?'<button class="btn soft sm" data-act="editGoal">목표 설정</button>':''}</div>
    <div class="row" style="align-items:flex-end">
      <div><div class="muted">모은 원금</div><div class="big">${money(cur)}</div></div>
      <div style="text-align:right"><div class="muted">달성률</div>
        <div class="money big ${has?rateCls(rateRaw):'c-sub'}">${has?pct(rateRaw):'-'}</div></div>
    </div>
    <div class="bar"><i style="width:${rate}%;background:${rateColor(rateRaw)}"></i></div>
    <div class="row muted"><span>목표 ${has?`<b style="color:var(--text)">${won(goalAmount)}</b>`:'미설정'}</span><span>${goalDate?goalDate.replace(/-/g,'.')+'까지':''}</span></div>
    <div class="stats">
      <div class="stat"><span class="l">남은 금액</span><span class="v ${has?(remain>0?'c-mid':'c-good'):''}">${has?(remain>0?shortWon(remain)+'원':'달성 🎉'):'-'}</span></div>
      <div class="stat"><span class="l">남은 기간</span><span class="v">${periodText(goalDate)}</span></div>

}

/* ---------- 은퇴계획 ---------- */
const RETIRE_DEFAULT = {age:40, retireAge:60, lifeAge:90, expense:3000000, pension:1000000, pensionAge:65,
  yearly:12000000, ret1:5, ret2:3, inflation:2.5, exclude:['부동산'], set:false};
function retireCfg(){
  if(!state.retire) state.retire = JSON.parse(JSON.stringify(RETIRE_DEFAULT));
  if(!Array.isArray(state.retire.exclude)) state.retire.exclude = [];
  if(state.retire.yearly==null){                                  // 예전 월 적립액 → 연 적립액으로 변환
    state.retire.yearly = state.retire.monthly!=null ? state.retire.monthly*12 : RETIRE_DEFAULT.yearly;
    delete state.retire.monthly;
  }
  return state.retire;
}
/* 가족 전체 자산을 항목별로 (주식 + 기타 자산 이름별) */
function familyParts(){
  const parts = [{name:'주식', amount:state.members.reduce((a,m)=>a+total(m),0), color:STOCK_COLOR}];
  const map = {};
  state.members.forEach(m=>othersOf(m).forEach(o=>{
    if(isMonthly(o)) return;                                       // 국민연금 월 수령액은 자산이 아님
    const k = o.name.trim();
    if(!map[k]){ map[k] = {name:k, amount:0, color:o.color}; parts.push(map[k]); }
    map[k].amount += o.amount||0;
  }));
  return parts;
}
function calcRetire(c, assets){
  const n = Math.max(0, c.retireAge - c.age);
  const rAge = c.age + n;                                         // 이미 은퇴했으면 지금 나이부터
  const L = Math.max(0, c.lifeAge - rAge);
  const g1 = c.ret1/100, g2 = c.ret2/100, inf = c.inflation/100;
  const factor = g1>0 ? (Math.pow(1+g1, n)-1)/g1 : n;            // 매년 적립 1원의 은퇴 시점 가치
  const fv = assets*Math.pow(1+g1, n) + c.yearly*factor;
  const netAt = (yrFromNow, ageK) => {
    const p = Math.pow(1+inf, yrFromNow);
    return Math.max(0, c.expense*12*p - (ageK>=c.pensionAge ? c.pension*12*p : 0));
  };
  let need = 0;
  for(let k=0;k<L;k++) need += netAt(n+k, rAge+k) / Math.pow(1+g2, k);
  const gap = need - fv;
  const extra = gap>0 && factor>0 ? gap/factor : 0;
  const deflate = Math.pow(1+inf, n);

  // 나이별 자산 흐름
  let bal = assets, deplete = null;
  const pts = [{age:c.age, bal}];
  const start = Math.min(c.age, c.retireAge);
  for(let a=c.age; a<c.lifeAge; a++){
    if(a < c.retireAge) bal = bal*(1+g1) + c.yearly;
    else {
      bal = (bal - netAt(a - c.age, a))*(1+g2);
      if(bal<=0){ if(deplete===null) deplete = a; bal = 0; }
    }
    pts.push({age:a+1, bal});
  }
  return {n, L, fv, need, gap, extra, deflate, pts, deplete, start};
}
function flowChart(pts, c, deplete){
  const W=600, H=210, pl=8, pr=8, pt=26, pb=26;
  if(pts.length<2) return '';
  const a0 = pts[0].age, a1 = pts[pts.length-1].age;
  const maxV = Math.max(1, ...pts.map(p=>p.bal));
  const x = a => pl + (a-a0)/(a1-a0||1)*(W-pl-pr);
  const y = v => pt + (1 - v/maxV)*(H-pt-pb);
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(p.age).toFixed(1)},${y(p.bal).toFixed(1)}`).join(' ');
  const area = `${line} L${x(a1)},${y(0)} L${x(a0)},${y(0)} Z`;
  const peak = pts.reduce((b,p)=>p.bal>b.bal?p:b, pts[0]);
  const rx = x(Math.max(a0, Math.min(a1, c.retireAge)));
  const lbl = (ax, txt, anchor) => `<text x="${ax}" y="${H-6}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="#8b95a1">${txt}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f6bed" stop-opacity=".28"/><stop offset="1" stop-color="#4f6bed" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#eef0f3" stroke-width="2"/>
    <path d="${area}" fill="url(#rg)"/>
    <path d="${line}" fill="none" stroke="#4f6bed" stroke-width="3" stroke-linejoin="round"/>
    ${c.retireAge>a0 && c.retireAge<a1 ? `<line x1="${rx}" x2="${rx}" y1="${pt-8}" y2="${y(0)}" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="${rx}" y="${pt-12}" text-anchor="middle" font-size="12" font-weight="800" fill="#f08c00">은퇴 ${c.retireAge}세</text>` : ''}
    ${peak.bal>0 ? `<circle cx="${x(peak.age)}" cy="${y(peak.bal)}" r="5" fill="#4f6bed"/>
      <text x="${Math.min(W-60, Math.max(60, x(peak.age)))}" y="${Math.max(14, y(peak.bal)-10)}" text-anchor="middle" font-size="12" font-weight="800" fill="#191f28">${shortWon(peak.bal)}원</text>` : ''}
    ${deplete!==null ? `<circle cx="${x(deplete)}" cy="${y(0)}" r="6" fill="#e03131"/>` : ''}
    ${lbl(x(a0), a0+'세', 'start')}
    ${deplete!==null ? lbl(x(deplete), deplete+'세 소진', x(deplete)>W-70?'end':'middle') : ''}
    ${lbl(x(a1), a1+'세', 'end')}
  </svg>`;
}
function renderRetire(){
  const c = retireCfg();
  const parts = familyParts();
  const inc = p => !c.exclude.includes(p.name);
  const assets = parts.filter(inc).reduce((a,p)=>a+p.amount,0);
  const r = calcRetire(c, assets);
  const rateRaw = r.need>0 ? r.fv/r.need*100 : (r.L>0?100:0);
  const pv = v => shortWon(v/r.deflate)+'원';

  let html = '';
  if(!c.set) html += `<div class="warn" style="margin:0 0 12px">아래는 예시 가정이에요. ‘가정 설정’에서 우리집 상황에 맞게 바꿔주세요.</div>`;

  let msg;
  if(r.L<=0) msg = `<div class="msg mid">기대 수명을 은퇴 나이보다 크게 설정해주세요.</div>`;
  else if(r.gap<=0) msg = `<div class="msg good">지금 계획대로면 은퇴 자금이 충분해요 🎉<br>${r.deplete===null?`${c.lifeAge}세까지 쓰고도 약 ${shortWon(r.pts[r.pts.length-1].bal)}원이 남아요.`:''}</div>`;
  else if(r.n>0) msg = `<div class="msg mid">매년 <b>${won(r.extra)}</b>을 더 모으면 ${c.retireAge}세에 필요 자금을 채울 수 있어요.</div>`;
  else msg = `<div class="msg bad">은퇴 자금이 ${shortWon(r.gap)}원 부족해요. 생활비나 은퇴 후 수익률을 조정해 보세요.</div>`;

  html += `<div class="card">
    <div class="card-h"><h2>은퇴 준비율</h2><button class="btn soft sm" data-act="editRetire">가정 설정</button></div>
    <div class="row" style="align-items:flex-end">
      <div><div class="muted">${c.retireAge}세에 모일 자금</div><div class="big">${money(r.fv)}</div></div>
      <div style="text-align:right"><div class="muted">준비율</div>
        <div class="money big ${rateCls(rateRaw)}">${pct(rateRaw)}</div></div>
    </div>
    <div class="bar"><i style="width:${Math.min(100,rateRaw)}%;background:${rateColor(rateRaw)}"></i></div>
    <div class="row muted"><span>필요 자금 <b style="color:var(--text)">${won(r.need)}</b></span><span>${c.retireAge}세 기준</span></div>
    <div class="stats">
      <div class="stat"><span class="l">은퇴까지</span><span class="v">${r.n>0?r.n+'년':'은퇴 중'}</span></div>
      <div class="stat"><span class="l">은퇴 후 생활</span><span class="v">${r.L}년</span></div>
      <div class="stat"><span class="l">${r.gap>0?'부족한 금액':'여유 금액'}</span><span class="v ${r.gap>0?'c-mid':'c-good'}">${shortWon(Math.abs(r.gap))}원</span></div>
      <div class="stat"><span class="l">추가 연 적립 필요</span><span class="v ${r.extra>0?'c-mid':'c-good'}">${r.gap<=0?'없음 ✓':r.n>0?shortWon(r.extra)+'원':'-'}</span></div>
    </div>
    ${msg}
    ${r.n>0?`<div class="hint" style="margin-top:10px">물가상승을 반영한 ${c.retireAge}세 시점 금액이에요. 지금 돈 가치로는 모일 자금 ${pv(r.fv)}, 필요 자금 ${pv(r.need)}이에요.</div>`:''}
  </div>`;

  html += `<div class="card flow">
    <div class="card-h"><h2>나이별 자산 흐름</h2></div>
    ${flowChart(r.pts, c, r.deplete)}
    ${r.deplete!==null && r.L>0 ? `<div class="msg bad">이대로면 <b>${r.deplete}세</b>에 자산이 바닥나요. (기대 수명 ${c.lifeAge}세)</div>` : ''}
  </div>`;

  html += `<div class="card">
    <div class="card-h"><h2>지금 준비된 자산</h2></div>
    <div class="muted">은퇴 자금에 넣을 자산</div>
    <div class="big">${money(assets)}</div>
    <div class="chips">${parts.map(p=>`<button class="chip ${inc(p)?'':'off'}" data-act="rtToggle" data-name="${esc(p.name)}"><i class="dot" style="background:${inc(p)?p.color:'#c5cad1'}"></i>${esc(p.name)} ${shortWon(p.amount)}원</button>`).join('')}</div>
    <div class="hint" style="margin-top:10px">눌러서 빼거나 넣을 수 있어요. 살고 있는 집처럼 생활비로 쓰기 어려운 자산은 빼두는 게 좋아요. 금액은 가족 탭에 입력한 값을 모두 합친 거예요.</div>
  </div>`;

  const arow = (l, v) => `<div class="asset"><span class="nm">${l}</span><span class="amt"><b>${v}</b></span></div>`;
  html += `<div class="card">
    <div class="card-h"><h2>계획 가정</h2><button class="btn soft sm" data-act="editRetire">수정</button></div>
    ${arow('현재 나이 → 은퇴 나이', `${c.age}세 → ${c.retireAge}세`)}
    ${arow('기대 수명', `${c.lifeAge}세`)}
    ${arow('은퇴 후 월 생활비 <em>지금 물가 기준</em>', won(c.expense))}
    ${arow('예상 연금 월액 <em>지금 물가 기준</em>', `${won(c.pension)} · ${c.pensionAge}세부터`)}
    ${arow('매년 적립액', won(c.yearly))}
    ${arow('수익률 <em>은퇴 전 / 후</em>', `${c.ret1}% / ${c.ret2}%`)}
    ${arow('물가상승률', `${c.inflation}%`)}
  </div>`;
  return html;
}

/* ---------- 모달 ---------- */
const modalBg = document.getElementById('modalBg');
const modal = document.getElementById('modal');
let onSubmit = null;
function openModal(title, fields, submit, extraBtn){
  modal.innerHTML = `<h3>${esc(title)}</h3>` + fields.map(f=>`
    <div class="field"><label>${esc(f.label)}</label>
      <input name="${f.name}" type="${f.type||'text'}" ${f.numeric||f.plain?'inputmode="decimal"':''} ${f.plain?'data-plain="1"':''} value="${esc(f.value??'')}" placeholder="${esc(f.ph||'')}" ${f.required?'required':''}>
      ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}
    </div>`).join('') +
    `<div class="actions">
      ${extraBtn?`<button type="button" class="btn danger" data-mact="extra">${esc(extraBtn.label)}</button>`:''}
      <button type="button" class="btn soft" data-mact="cancel">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>`;
  onSubmit = submit;
  modal._extra = extraBtn && extraBtn.fn;
  modal._allocAct = null;
  modalBg.classList.add('show');
  setTimeout(()=>{ const i = modal.querySelector('input'); if(i) i.focus(); }, 50);
}
function closeModal(){ modalBg.classList.remove('show'); onSubmit=null; }
modal.addEventListener('submit', e=>{
  e.preventDefault();
  const data = Object.fromEntries(new FormData(modal));
  if(onSubmit && onSubmit(data)!==false){ save(); closeModal(); render(); }
});
modal.addEventListener('click', e=>{
  const a = e.target.dataset.mact;
  if(a==='cancel') closeModal();
  if(['even','current','fill'].includes(a) && modal._allocAct) modal._allocAct(a);
  if(a==='extra' && modal._extra){ if(modal._extra()!==false){ save(); closeModal(); render(); } }
});
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeModal(); });
// 금액 입력 시 콤마 자동
modal.addEventListener('input', e=>{
  const el = e.target;
  if(el.closest('.field') && el.getAttribute('inputmode')==='decimal' && el.name!=='target' && !el.dataset.plain){
    const raw = el.value.replace(/[^0-9]/g,'');
    el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
  }
  if(el.dataset.pct) updateAllocSum();
});
function updateAllocSum(){
  const box = document.getElementById('allocSum');
  if(!box) return;
  const sum = [...modal.querySelectorAll('input[data-pct]')].reduce((a,i)=>a+num(i.value),0);
  const left = r1(100-sum);
  const cls = Math.abs(left)<0.01 ? 'c-good' : left>0 ? 'c-mid' : 'c-over';
  box.innerHTML = `<span>합계 <b class="money ${cls}" style="font-size:17px">${pct(sum)}</b> <span class="muted">/ 100%</span></span>
    <span class="${cls}" style="font-weight:700;font-size:13px">${Math.abs(left)<0.01?'딱 맞아요 ✓':left>0?`${pct(left)} 남음`:`${pct(-left)} 초과`}</span>`;
}
function openAllocate(m){
  const c = total(m);
  modal.innerHTML = `<h3>원금 100% 나누기</h3>
    <div class="muted" style="margin-bottom:14px">주식 원금 전체를 100%로 보고, 종목마다 몇 %씩 모을지 정해요</div>
    <div class="alloc-sum" id="allocSum"></div>
    ${m.stocks.map(s=>`<div class="alloc-row">
      <label><i class="dot" style="background:${s.color}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
        <span class="muted" style="font-weight:500;flex:none">현재 ${pct(c>0?(s.principal||0)/c*100:0)}</span></label>
      <input name="t_${s.id}" data-pct="1" inputmode="decimal" value="${s.target||''}" placeholder="0"><span class="muted">%</span>
    </div>`).join('')}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <button type="button" class="btn soft sm" data-mact="even">똑같이 나누기</button>
      <button type="button" class="btn soft sm" data-mact="current">현재 비중으로</button>
      <button type="button" class="btn soft sm" data-mact="fill">남은 % 마지막 종목에</button>
    </div>
    <div class="actions">
      <button type="button" class="btn soft" data-mact="cancel">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>`;
  const inputs = () => [...modal.querySelectorAll('input[data-pct]')];
  const fixLast = () => { const ins = inputs(); const others = ins.slice(0,-1).reduce((a,i)=>a+num(i.value),0); ins[ins.length-1].value = r1(Math.max(0,100-others)); };
  modal._allocAct = act => {
    const ins = inputs();
    if(act==='even'){ ins.forEach(i=>i.value = r1(100/ins.length)); fixLast(); }
    if(act==='current'){ const t = total(m); if(t<=0){ alert('아직 원금이 없어요'); return; } m.stocks.forEach((s,k)=>ins[k].value = r1((s.principal||0)/t*100)); fixLast(); }
    if(act==='fill'){ fixLast(); }
    updateAllocSum();
  };
  onSubmit = d => {
    const vals = m.stocks.map(s=>num(d['t_'+s.id]));
    const sum = vals.reduce((a,v)=>a+v,0);
    if(Math.abs(sum-100)>0.05 && !confirm(`합계가 ${pct(sum)}예요. 그래도 저장할까요?`)) return false;
    m.stocks.forEach((s,k)=>s.target = vals[k]);
  };
  modal._extra = null;
  modalBg.classList.add('show');
  updateAllocSum();
  setTimeout(()=>{ const i = modal.querySelector('input'); if(i) i.focus(); }, 50);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const m = member(state.selected);

  if(act==='sel'){ state.selected = id; save(); render(); window.scrollTo({top:0}); }
  if(act==='chart'){ if(chartReg[id]) openDetail(chartReg[id]); return; }

  if(act==='addMember'){
    openModal('가족 추가', [{name:'name', label:'이름', ph:'예: 엄마, 아빠, 첫째', required:true}], d=>{
      const nm = {id:uid(), name:d.name.trim()||'가족', goalAmount:0, goalDate:'', stocks:[]};
      state.members.push(nm); state.selected = nm.id;
    });
  }
  if(act==='renameMember'){
    openModal('이름 변경', [{name:'name', label:'이름', value:m.name, required:true}], d=>{ m.name = d.name.trim()||m.name; });
  }
  if(act==='delMember'){
    if(confirm(`'${m.name}'의 모든 기록을 삭제할까요?`)){
      state.members = state.members.filter(x=>x.id!==m.id); state.selected='all'; save(); render();
    }
  }
  if(act==='editGoal'){
    openModal('목표 설정', [
      {name:'goalAmount', label:'목표 원금 (원)', numeric:true, value:m.goalAmount?m.goalAmount.toLocaleString('ko-KR'):'', ph:'예: 100,000,000'},
      {name:'goalDate', label:'목표 기간 (언제까지)', type:'date', value:m.goalDate||''},
    ], d=>{ m.goalAmount = num(d.goalAmount); m.goalDate = d.goalDate; });
  }
  if(act==='allocate'){ openAllocate(m); }
  if(act==='rtToggle'){
    const c = retireCfg(), nm = t.dataset.name;
    c.exclude = c.exclude.includes(nm) ? c.exclude.filter(x=>x!==nm) : [...c.exclude, nm];
    save(); render();
  }
  if(act==='editRetire'){
    const c = retireCfg();
    const w = v => (v||0).toLocaleString('ko-KR');
    openModal('은퇴계획 가정', [
      {name:'age', label:'현재 나이 (세)', plain:true, value:c.age, required:true},
      {name:'retireAge', label:'은퇴 나이 (세)', plain:true, value:c.retireAge, required:true},
      {name:'lifeAge', label:'기대 수명 (세)', plain:true, value:c.lifeAge, required:true, hint:'넉넉하게 90~100세로 잡는 걸 권해요'},
      {name:'expense', label:'은퇴 후 월 생활비 (원)', numeric:true, value:w(c.expense), hint:'지금 물가 기준으로 적으면 물가상승은 자동 반영돼요'},
      {name:'pension', label:'예상 연금 월액 (원)', numeric:true, value:w(c.pension), hint:'국민연금·개인연금 등 매달 받을 금액 합계 (지금 물가 기준)'},
      {name:'pensionAge', label:'연금 받기 시작하는 나이 (세)', plain:true, value:c.pensionAge},
      {name:'yearly', label:'은퇴 전까지 매년 적립액 (원)', numeric:true, value:w(c.yearly), hint:'1년 동안 모으는 금액 합계'},
      {name:'ret1', label:'은퇴 전 연 수익률 (%)', plain:true, value:c.ret1},
      {name:'ret2', label:'은퇴 후 연 수익률 (%)', plain:true, value:c.ret2, hint:'은퇴 후엔 안전하게 굴리니 낮게 잡아요'},
      {name:'inflation', label:'물가상승률 (%)', plain:true, value:c.inflation},
    ], d=>{
      const v = {age:num(d.age), retireAge:num(d.retireAge), lifeAge:num(d.lifeAge)};
      if(v.lifeAge<=v.retireAge){ alert('기대 수명은 은퇴 나이보다 커야 해요'); return false; }
      if(v.lifeAge-Math.min(v.age,v.retireAge)>120){ alert('나이를 다시 확인해주세요'); return false; }
      Object.assign(c, v, {expense:num(d.expense), pension:num(d.pension), pensionAge:num(d.pensionAge)||v.retireAge,
        yearly:num(d.yearly), ret1:num(d.ret1), ret2:num(d.ret2), inflation:num(d.inflation), set:true});
    });
  }
  if(act==='addStock'){
    const left = Math.max(0, 100 - targetSum(m));
    openModal('종목 추가', [
      {name:'name', label:'종목명', ph:'예: S&P500 ETF', required:true},
      {name:'principal', label:'지금까지 넣은 원금 (원)', numeric:true, ph:'0'},
      {name:'target', label:'목표 비중 (%)', numeric:true, value: left? String(r1(left)):'', hint:`남은 비중 ${pct(left)}`},
    ], d=>{
      const used = m.stocks.map(s=>s.color);
      const color = COLORS.find(c=>!used.includes(c)) || COLORS[m.stocks.length%COLORS.length];
      m.stocks.push({id:uid(), name:d.name.trim(), principal:num(d.principal), target:num(d.target), color});
    });
  }
  if(act==='editStock'){
    const s = m.stocks.find(x=>x.id===id);
    openModal('종목 편집', [
      {name:'name', label:'종목명', value:s.name, required:true},
      {name:'principal', label:'누적 원금 (원)', numeric:true, value:(s.principal||0).toLocaleString('ko-KR')},
      {name:'target', label:'목표 비중 (%)', numeric:true, value:String(s.target||0)},
    ], d=>{ s.name=d.name.trim()||s.name; s.principal=num(d.principal); s.target=num(d.target); },
    {label:'삭제', fn:()=>{ if(!confirm(`'${s.name}' 종목을 삭제할까요?`)) return false; m.stocks = m.stocks.filter(x=>x.id!==id); }});
  }
  if(act==='contribute'){
    const s = m.stocks.find(x=>x.id===id);
    openModal(`${s.name} 적립`, [
      {name:'amount', label:'추가로 넣은 금액 (원)', numeric:true, ph:'예: 300,000', required:true, hint:`현재 원금 ${won(s.principal)}`},
    ], d=>{ s.principal = (s.principal||0) + num(d.amount); });
  }
  if(act==='addOther'){
    const preset = t.dataset.name || '';
    openModal('기타 자산 추가', [
      {name:'name', label:'자산 이름', value:preset, ph:'예: 국민연금, 부동산, 현금', required:true},
      preset==='국민연금'
        ? {name:'amount', label:'예상 월 수령액 (원)', numeric:true, ph:'예: 1,200,000', hint:'매달 받을 금액이라 총 자산에는 더하지 않고 따로 보여줘요'}
        : {name:'amount', label:'금액 (원)', numeric:true, ph:'예: 30,000,000', hint:'이름을 ‘국민연금’으로 하면 월 수령액으로 보고 총 자산에서 빼요'},
    ], d=>{
      const list = othersOf(m);
      const used = list.map(o=>o.color);
      const color = ASSET_COLORS.find(c=>!used.includes(c)) || ASSET_COLORS[list.length%ASSET_COLORS.length];
      list.push({id:uid(), name:d.name.trim()||'기타', amount:num(d.amount), color});
    });
  }
  if(act==='editOther'){
    const o = othersOf(m).find(x=>x.id===id);
    openModal('기타 자산 편집', [
      {name:'name', label:'자산 이름', value:o.name, required:true},
      {name:'amount', label:isMonthly(o)?'예상 월 수령액 (원)':'금액 (원)', numeric:true, value:(o.amount||0).toLocaleString('ko-KR'),
        hint:isMonthly(o)?'매달 받을 금액이라 총 자산에는 더하지 않아요':''},
    ], d=>{ o.name = d.name.trim()||o.name; o.amount = num(d.amount); },
    {label:'삭제', fn:()=>{ if(!confirm(`'${o.name}'을(를) 삭제할까요?`)) return false; m.others = m.others.filter(x=>x.id!==id); }});
  }
});

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

render();
</script>

</html>
