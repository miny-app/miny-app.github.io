<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차곡차곡 우리집 주식</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f5f8; --card:#fff; --text:#1d2433; --sub:#7a8294; --line:#eceef3;
  --primary:#3b6cf6; --primary-soft:#eaf0ff; --up:#e5484d; --down:#2f6fed; --ok:#18a058; --warn:#f59e0b;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(244,245,248,.92);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.top h1 span{color:var(--primary)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;background:#fff;font-weight:600;font-size:14px;color:var(--sub);box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;align-items:center;gap:6px}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab.on{background:var(--text);color:#fff}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card h2 small{font-size:12px;font-weight:600;color:var(--sub)}
.label{font-size:13px;color:var(--sub);font-weight:500}
.big{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:4px 0 2px}
.pl{font-size:15px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.row3 b{display:block;font-size:15px;margin-top:2px}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:12px}
.btn{padding:14px 10px;border-radius:14px;font-weight:700;font-size:14px;background:#fff;box-shadow:0 1px 3px rgba(20,30,60,.05);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);color:#fff}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.danger{background:#fff0f0;color:var(--up);box-shadow:none}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.donut-wrap{display:flex;align-items:center;gap:20px;margin-bottom:8px}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:12px;color:var(--sub);line-height:1.3}
.donut-center b{display:block;color:var(--text);font-size:15px}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.legend div{display:flex;align-items:center;gap:6px}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .dot,.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.wrow{padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:none}
.wrow-head{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.wrow-head .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow-head .pct{font-weight:700}
.wrow-head .pct small{color:var(--sub);font-weight:500}
.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.badge.need{background:#fff4e5;color:#c26a00}
.badge.over{background:#eef3ff;color:var(--primary)}
.badge.ok{background:#e8f7ee;color:var(--ok)}
.bar{position:relative;height:10px;background:#f0f1f5;border-radius:6px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;max-width:100%}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px;transform:translateX(-1.5px)}
.hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.tsum{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.tsum.ok{background:#e8f7ee;color:var(--ok)}
.tsum.bad{background:#fff4e5;color:#c26a00}
.hold{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hold:first-of-type{border-top:none}
.hold .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.hold .mid{flex:1;min-width:0}
.hold .mid b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hold .mid span{font-size:12px;color:var(--sub)}
.hold .rt{text-align:right}
.hold .rt b{display:block;font-size:15px}
.hold .rt span{font-size:12px;font-weight:600}
.empty{text-align:center;padding:30px 10px;color:var(--sub);font-size:14px;line-height:1.6}
.empty .e{font-size:40px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-of-type{border-top:none}
.mrow .nm{flex:1;font-weight:700}
.mrow .v{text-align:right;font-weight:700}
.mrow .v small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:6px;background:#f0f1f5}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.hist:first-child{border-top:none}
.hist .d{color:var(--sub);width:72px;flex:none}
.hist .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .x{color:#c0c4ce;padding:4px 6px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:22px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.modal h3{font-size:19px;font-weight:800;margin-bottom:4px}
.modal .desc{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fafbfc;outline:none}
.field input:focus{border-color:var(--primary);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#f0f1f5;border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mfoot{display:flex;gap:8px;margin-top:18px}
.mfoot .btn{flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:7px 11px;border-radius:9px;background:#f0f1f5;font-size:13px;font-weight:600}
.conv{font-size:13px;color:var(--primary);font-weight:600;margin-top:6px;min-height:18px}
.plan{margin-top:14px;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px}
.prow .nm span{font-size:12px;color:var(--sub)}
.prow input{width:70px;padding:9px;border:1.5px solid var(--line);border-radius:10px;text-align:right;font-size:15px;font-weight:700}
.prow .amt{width:96px;text-align:right;font-size:13px;font-weight:600}
.ptotal{display:flex;justify-content:space-between;padding:12px 0 0;font-size:14px}
.ptotal b{font-size:16px}
.mem-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mem-edit input{flex:1;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.mem-edit input[type=color]{flex:none;width:44px;height:44px;padding:3px}
.sec-title{font-size:14px;font-weight:800;margin:18px 0 10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:99;animation:up .2s}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:16px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>🌱 차곡차곡 <span>우리집 주식</span></h1>
    <button class="icon-btn" onclick="openSettings()" aria-label="설정">⚙️</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>

<script>
const KEY = 'app-a6ky5:data';
const VIEW_KEY = 'app-a6ky5:view';
const PALETTE = ['#3b6cf6','#f97316','#10b981','#a855f7','#ef4444','#06b6d4','#eab308','#ec4899','#64748b','#84cc16','#6366f1','#14b8a6'];
const uid = () => Math.random().toString(36).slice(2, 10);

function defaultData(){
  return {
    fx: 1400,
    members: [
      {id: uid(), name: '남편', color: '#3b6cf6'},
      {id: uid(), name: '아내', color: '#ec4899'},
      {id: uid(), name: '자녀', color: '#10b981'}
    ],
    holdings: [],
    history: []
  };
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.members) return d; }catch(e){}
  return defaultData();
}
let S = load();
let view = localStorage.getItem(VIEW_KEY) || 'all';
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function setView(v){ view = v; localStorage.setItem(VIEW_KEY, v); render(); window.scrollTo({top:0}); }

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
function short(n){
  const neg = n < 0; n = Math.abs(Math.round(n));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4);
  let s = '';
  if(eok) s += eok.toLocaleString() + '억 ';
  if(man) s += man.toLocaleString() + '만';
  if(!s) s = n.toLocaleString();
  return (neg ? '-' : '') + s.trim() + '원';
}
const price = (h, p) => h.currency === 'USD' ? '$' + (+p).toLocaleString('en-US', {maximumFractionDigits: 2}) : Math.round(p).toLocaleString() + '원';
const rate = h => h.currency === 'USD' ? (S.fx || 1) : 1;
const priceKRW = h => h.price * rate(h);
const valueOf = h => h.qty * h.price * rate(h);
const costOf = h => h.qty * h.avg * rate(h);
const pct = (a, b) => b ? a / b * 100 : 0;
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const plCls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const sign = n => n > 0 ? '+' : '';
const today = () => new Date().toISOString().slice(0, 10);
const member = id => S.members.find(m => m.id === id);
const holdingsOf = mid => S.holdings.filter(h => h.memberId === mid);
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; document.body.style.overflow = ''; }

function donut(items, centerHtml){
  const total = sum(items, i => i.v);
  let acc = 0, stops = [];
  if(total > 0){
    items.forEach(i => { const a = acc / total * 100, b = (acc + i.v) / total * 100; stops.push(`${i.c} ${a}% ${b}%`); acc += i.v; });
  } else stops.push('#eceef3 0 100%');
  return `<div class="donut" style="background:conic-gradient(${stops.join(',')})"><div class="donut-center"><div>${centerHtml}</div></div></div>`;
}

/* ---------- render ---------- */
function render(){
  if(view !== 'all' && !member(view)) view = 'all';
  document.getElementById('tabs').innerHTML =
    `<button class="tab ${view==='all'?'on':''}" onclick="setView('all')">🏠 가계 전체</button>` +
    S.members.map(m => `<button class="tab ${view===m.id?'on':''}" onclick="setView('${m.id}')"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}</button>`).join('') +
    `<button class="tab" onclick="openMemberAdd()">＋</button>`;
  document.getElementById('app').innerHTML = view === 'all' ? renderAll() : renderMember(view);
}

function summaryCard(title, hs){
  const v = sum(hs, valueOf), c = sum(hs, costOf), pl = v - c;
  return `<section class="card">
    <div class="label">${title}</div>
    <div class="big">${won(v)}</div>
    <div class="pl ${plCls(pl)}">${sign(pl)}${won(pl)} (${sign(pl)}${f1(pct(pl, c))}%)</div>
    <div class="row3">
      <div><span class="label">투자원금</span><b>${short(c)}</b></div>
      <div><span class="label">보유 종목</span><b>${hs.length}개</b></div>
    </div>
  </section>`;
}

function renderAll(){
  const all = S.holdings;
  const total = sum(all, valueOf);
  let html = summaryCard('우리집 주식 자산', all);

  // 구성원별
  const ms = S.members.map(m => ({m, v: sum(holdingsOf(m.id), valueOf), c: sum(holdingsOf(m.id), costOf)}));
  html += `<section class="card"><h2>구성원별 자산 <small>탭하면 상세보기</small></h2>
    <div class="stack">${ms.filter(x => x.v > 0).map(x => `<div style="width:${pct(x.v, total)}%;background:${x.m.color}"></div>`).join('')}</div>
    ${ms.map(x => { const pl = x.v - x.c; return `<button class="mrow" onclick="setView('${x.m.id}')">
      <span class="dot" style="background:${x.m.color};width:12px;height:12px;border-radius:4px"></span>
      <span class="nm">${esc(x.m.name)} <small class="label">${f1(pct(x.v, total))}%</small></span>
      <span class="v">${short(x.v)}<small class="${plCls(pl)}">${sign(pl)}${f1(pct(pl, x.c))}%</small></span>
      <span style="color:#c0c4ce">›</span></button>`; }).join('')}
  </section>`;

  // 전체 종목 합산
  const map = {};
  all.forEach(h => {
    const k = (h.ticker || h.name).trim().toUpperCase();
    if(!map[k]) map[k] = {name: h.name, v: 0, c: 0, who: new Set()};
    map[k].v += valueOf(h); map[k].c += costOf(h); map[k].who.add(member(h.memberId)?.name);
  });
  const agg = Object.values(map).sort((a, b) => b.v - a.v).map((x, i) => ({...x, col: PALETTE[i % PALETTE.length]}));
  if(agg.length){
    html += `<section class="card"><h2>가계 전체 종목 비중</h2>
      <div class="donut-wrap">${donut(agg.map(a => ({v: a.v, c: a.col})), `<b>${agg.length}종목</b>합산`)}
        <div class="legend">${agg.slice(0, 6).map(a => `<div><span class="dot" style="background:${a.col}"></span><span class="nm">${esc(a.name)}</span><b>${f1(pct(a.v, total))}%</b></div>`).join('')}${agg.length > 6 ? `<div class="label">외 ${agg.length - 6}개</div>` : ''}</div>
      </div>
      ${agg.map(a => { const pl = a.v - a.c; return `<div class="hist">
        <span class="dot" style="background:${a.col}"></span>
        <span class="n">${esc(a.name)} <small class="label">${[...a.who].map(esc).join('·')}</small></span>
        <span style="text-align:right"><b>${short(a.v)}</b><br><small class="${plCls(pl)}">${sign(pl)}${f1(pct(pl, a.c))}%</small></span>
      </div>`; }).join('')}
    </section>`;
  } else {
    html += `<section class="card"><div class="empty"><div class="e">🌱</div>아직 등록된 주식이 없어요.<br>위의 구성원 탭을 눌러 종목을 추가해 보세요.<br><br>
      <button class="btn soft" style="margin:0 auto" onclick="loadSample()">예시 데이터로 둘러보기</button></div></section>`;
  }
  html += `<div class="foot">환율 1$ = ${(+S.fx).toLocaleString()}원 · 현재가는 직접 입력한 값 기준이에요</div>`;
  return html;
}

function renderMember(mid){
  const m = member(mid);
  const hs = holdingsOf(mid).map((h, i) => ({h, col: PALETTE[i % PALETTE.length]}));
  const total = sum(hs, x => valueOf(x.h));
  const tsum = sum(hs, x => +x.h.target || 0);
  let html = summaryCard(`${esc(m.name)}의 주식`, hs.map(x => x.h));

  html += `<div class="actions">
    <button class="btn primary" onclick="openAccumulate('${mid}')" ${hs.length ? '' : 'disabled'}>💰 이번 달 모으기</button>
    <button class="btn" onclick="openPrices('${mid}')" ${hs.length ? '' : 'disabled'}>✏️ 현재가</button>
    <button class="btn soft" onclick="openHolding('${mid}')">＋ 종목</button>
  </div>`;

  if(!hs.length){
    return html + `<section class="card"><div class="empty"><div class="e">📈</div>${esc(m.name)}의 첫 종목을 추가해 보세요.<br>목표비중을 정해두면 매달 무엇을 몇 주 살지 알려드려요.</div></section>`;
  }

  // 비중 카드
  const tsCls = Math.abs(tsum - 100) < 0.01 ? 'ok' : 'bad';
  const tsTxt = tsCls === 'ok' ? '목표 합계 100% ✓' : `목표 합계 ${f1(tsum)}%`;
  html += `<section class="card"><h2>현재 비중 vs 목표 <span class="tsum ${tsCls}">${tsTxt}</span></h2>
    <div class="donut-wrap">${donut(hs.map(x => ({v: valueOf(x.h), c: x.col})), `<b>${short(total)}</b>평가금액`)}
      <div class="legend">${hs.slice(0, 6).map(x => `<div><span class="dot" style="background:${x.col}"></span><span class="nm">${esc(x.h.name)}</span><b>${f1(pct(valueOf(x.h), total))}%</b></div>`).join('')}</div>
    </div>
    ${hs.map(x => {
      const cur = pct(valueOf(x.h), total), tg = tsum ? (+x.h.target || 0) / tsum * 100 : 0, d = cur - tg;
      const badge = !x.h.target ? '<span class="badge ok">목표 없음</span>'
        : Math.abs(d) < 1 ? '<span class="badge ok">적정</span>'
        : d < 0 ? `<span class="badge need">${f1(-d)}%p 부족</span>` : `<span class="badge over">${f1(d)}%p 초과</span>`;
      return `<div class="wrow"><div class="wrow-head"><span class="dot" style="background:${x.col}"></span><span class="nm">${esc(x.h.name)}</span>
        <span class="pct">${f1(cur)}% <small>/ 목표 ${f1(+x.h.target || 0)}%</small></span>${badge}</div>
        <div class="bar"><div class="fill" style="width:${Math.min(cur, 100)}%;background:${x.col}"></div>${x.h.target ? `<div class="mark" style="left:${Math.min(tg, 100)}%"></div>` : ''}</div></div>`;
    }).join('')}
    <div class="hint">막대는 현재 비중, 검은 선은 목표 비중이에요. ${tsCls === 'bad' ? '목표 합계가 100%가 아니면 비율대로 환산해서 계산해요.' : ''}</div>
  </section>`;

  // 보유 종목
  html += `<section class="card"><h2>보유 종목 <small>탭해서 수정·추가매수</small></h2>
    ${hs.map(x => { const v = valueOf(x.h), c = costOf(x.h), pl = v - c; return `<button class="hold" onclick="openHolding('${mid}','${x.h.id}')">
      <span class="ic" style="background:${x.col}">${esc(x.h.name.slice(0, 1))}</span>
      <span class="mid"><b>${esc(x.h.name)}</b><span>${(+x.h.qty).toLocaleString()}주 · 평단 ${price(x.h, x.h.avg)} · 현재 ${price(x.h, x.h.price)}</span></span>
      <span class="rt"><b>${short(v)}</b><span class="${plCls(pl)}">${sign(pl)}${f1(pct(pl, c))}%</span></span>
    </button>`; }).join('')}
  </section>`;

  // 매수 기록
  const hist = S.history.filter(r => r.memberId === mid).sort((a, b) => b.date.localeCompare(a.date) || b.t - a.t);
  if(hist.length){
    html += `<section class="card"><details><summary><h2 style="margin:0">매수 기록 <small>${hist.length}건 ▾</small></h2></summary><div style="margin-top:12px">
      ${hist.slice(0, 100).map(r => `<div class="hist"><span class="d">${r.date.slice(2).replace(/-/g, '.')}</span>
        <span class="n">${esc(r.name)} ${(+r.qty).toLocaleString()}주</span>
        <span>${r.currency === 'USD' ? '$' + (+r.price).toLocaleString('en-US') : Math.round(r.price).toLocaleString() + '원'}</span>
        <button class="x" onclick="delHist('${r.id}')">✕</button></div>`).join('')}
      <div class="hint">기록 삭제는 기록만 지우고 보유 수량은 바뀌지 않아요.</div></div></details></section>`;
  }
  return html;
}

/* ---------- holding modal ---------- */
let hCur = 'KRW';
function openHolding(mid, hid){
  const h = hid ? S.holdings.find(x => x.id === hid) : null;
  hCur = h ? h.currency : 'KRW';
  const m = member(mid);
  openModal(`
    <h3>${h ? '종목 수정' : `${esc(m.name)}에게 종목 추가`}</h3>
    <p class="desc">${h ? '보유 정보와 목표비중을 고칠 수 있어요.' : '이미 가지고 있는 주식이라면 수량과 평단가를, 새로 모을 주식이라면 수량 0으로 넣어주세요.'}</p>
    <div class="field"><label>종목명</label><input id="f-name" value="${esc(h?.name || '')}" placeholder="예: 삼성전자, S&P500 ETF"></div>
    <div class="grid2">
      <div class="field"><label>티커/코드 (선택)</label><input id="f-ticker" value="${esc(h?.ticker || '')}" placeholder="005930, VOO"></div>
      <div class="field"><label>통화</label><div class="seg" id="f-cur">
        <button type="button" class="${hCur==='KRW'?'on':''}" onclick="setCur('KRW')">₩ 원화</button>
        <button type="button" class="${hCur==='USD'?'on':''}" onclick="setCur('USD')">$ 달러</button></div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>보유 수량 (주)</label><input id="f-qty" type="number" inputmode="decimal" step="any" value="${h ? h.qty : ''}" placeholder="0"></div>
      <div class="field"><label>목표 비중 (%)</label><input id="f-target" type="number" inputmode="decimal" step="any" value="${h ? h.target : ''}" placeholder="예: 30"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>평균 단가 <span class="cu"></span></label><input id="f-avg" type="number" inputmode="decimal" step="any" value="${h ? h.avg : ''}" placeholder="0"></div>
      <div class="field"><label>현재가 <span class="cu"></span></label><input id="f-price" type="number" inputmode="decimal" step="any" value="${h ? h.price : ''}" placeholder="0"></div>
    </div>
    ${h ? `
    <div class="sec-title">➕ 추가 매수 기록</div>
    <div class="grid2">
      <div class="field"><label>매수 수량</label><input id="b-qty" type="number" inputmode="decimal" step="any" placeholder="0"></div>
      <div class="field"><label>매수 단가 <span class="cu"></span></label><input id="b-price" type="number" inputmode="decimal" step="any" value="${h.price}"></div>
    </div>
    <button class="btn soft full" onclick="addBuy('${hid}')">매수 반영하기 (평단 자동계산)</button>` : ''}
    <div class="mfoot">
      ${h ? `<button class="btn danger" onclick="delHolding('${hid}')">삭제</button>` : `<button class="btn" onclick="closeModal()">취소</button>`}
      <button class="btn primary" style="flex:2" onclick="saveHolding('${mid}','${hid || ''}')">저장</button>
    </div>`);
  setCur(hCur);
  if(!h) document.getElementById('f-name').focus();
}
function setCur(c){
  hCur = c;
  document.querySelectorAll('#f-cur button').forEach((b, i) => b.classList.toggle('on', (i === 0) === (c === 'KRW')));
  document.querySelectorAll('.cu').forEach(e => e.textContent = c === 'USD' ? '($)' : '(원)');
}
function saveHolding(mid, hid){
  const name = document.getElementById('f-name').value.trim();
  if(!name) return toast('종목명을 입력해 주세요');
  const d = {
    name, ticker: document.getElementById('f-ticker').value.trim(), currency: hCur,
    qty: num(document.getElementById('f-qty').value), target: num(document.getElementById('f-target').value),
    avg: num(document.getElementById('f-avg').value), price: num(document.getElementById('f-price').value)
  };
  if(!d.price && d.avg) d.price = d.avg;
  if(hid) Object.assign(S.holdings.find(x => x.id === hid), d);
  else S.holdings.push({id: uid(), memberId: mid, ...d});
  save(); closeModal(); render(); toast('저장했어요');
}
function delHolding(hid){
  const h = S.holdings.find(x => x.id === hid);
  if(!confirm(`'${h.name}'을(를) 삭제할까요?`)) return;
  S.holdings = S.holdings.filter(x => x.id !== hid);
  save(); closeModal(); render();
}
function applyBuy(h, q, p){
  const nq = h.qty + q;
  h.avg = nq ? (h.qty * h.avg + q * p) / nq : p;
  h.qty = nq;
  S.history.push({id: uid(), memberId: h.memberId, holdingId: h.id, name: h.name, date: today(), t: Date.now(), qty: q, price: p, currency: h.currency});
}
function addBuy(hid){
  const h = S.holdings.find(x => x.id === hid);
  const q = num(document.getElementById('b-qty').value), p = num(document.getElementById('b-price').value);
  if(q <= 0 || p <= 0) return toast('매수 수량과 단가를 입력해 주세요');
  applyBuy(h, q, p);
  save(); closeModal(); render(); toast(`${h.name} ${q}주 매수 반영!`);
}
function delHist(id){
  if(!confirm('이 매수 기록을 지울까요? (보유 수량은 그대로예요)')) return;
  S.history = S.history.filter(r => r.id !== id); save(); render();
}

/* ---------- price batch ---------- */
function openPrices(mid){
  const hs = holdingsOf(mid);
  openModal(`<h3>현재가 한번에 입력</h3><p class="desc">증권사 앱을 보면서 현재가만 쭉 입력하세요.</p>
    ${hs.map(h => `<div class="field"><label>${esc(h.name)} ${h.currency === 'USD' ? '($)' : '(원)'}</label><input type="number" inputmode="decimal" step="any" data-id="${h.id}" value="${h.price}"></div>`).join('')}
    <div class="field"><label>환율 (1$ = 원)</label><input id="p-fx" type="number" inputmode="decimal" step="any" value="${S.fx}"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" style="flex:2" onclick="savePrices()">저장</button></div>`);
}
function savePrices(){
  document.querySelectorAll('.modal input[data-id]').forEach(i => { const h = S.holdings.find(x => x.id === i.dataset.id); if(h) h.price = num(i.value); });
  const fx = num(document.getElementById('p-fx').value); if(fx > 0) S.fx = fx;
  save(); closeModal(); render(); toast('현재가를 업데이트했어요');
}

/* ---------- accumulate (모으기) ---------- */
let accMid = null, accPlan = [];
function openAccumulate(mid){
  accMid = mid;
  const m = member(mid);
  openModal(`<h3>💰 ${esc(m.name)} 이번 달 모으기</h3>
    <p class="desc">투자할 금액을 넣으면 목표비중에 가까워지도록 <b>무엇을 몇 주 살지</b> 계산해 드려요. 팔지 않고 사기만 해서 맞춰가요.</p>
    <div class="field"><label>이번에 투자할 금액 (원)</label><input id="a-amt" type="number" inputmode="numeric" placeholder="예: 500000" oninput="calcPlan()">
      <div class="conv" id="a-conv"></div>
      <div class="quick">${[100000, 300000, 500000, 1000000].map(v => `<button onclick="addAmt(${v})">+${short(v).replace('원', '')}</button>`).join('')}<button onclick="addAmt(0)">초기화</button></div>
    </div>
    <div id="a-plan"></div>`);
  setTimeout(() => document.getElementById('a-amt').focus(), 50);
}
function addAmt(v){
  const i = document.getElementById('a-amt');
  i.value = v ? num(i.value) + v : ''; calcPlan();
}
function calcPlan(){
  const amt = num(document.getElementById('a-amt').value);
  document.getElementById('a-conv').textContent = amt ? short(amt) : '';
  const box = document.getElementById('a-plan');
  if(amt <= 0){ box.innerHTML = ''; return; }
  const hs = holdingsOf(accMid);
  const tsum = sum(hs, h => +h.target || 0);
  if(!tsum){ box.innerHTML = '<div class="hint">먼저 종목별 목표비중을 설정해 주세요.</div>'; return; }
  const V = sum(hs, valueOf), T = V + amt;
  const buy = hs.map(() => 0);
  let rem = amt, guard = 0;
  while(guard++ < 100000){
    let best = -1, bs = -Infinity;
    hs.forEach((h, i) => {
      const p = priceKRW(h);
      if(!h.target || p <= 0 || p > rem) return;
      const goal = h.target / tsum * T, cur = valueOf(h) + buy[i] * p;
      const s = (goal - cur - p / 2) / goal;
      if(s > bs){ bs = s; best = i; }
    });
    if(best < 0 || bs < -0.05) break;
    buy[best]++; rem -= priceKRW(hs[best]);
  }
  accPlan = hs.map((h, i) => ({h, q: buy[i]}));
  renderPlan();
}
function renderPlan(){
  const amt = num(document.getElementById('a-amt').value);
  const hs = accPlan.map(x => x.h);
  const tsum = sum(hs, h => +h.target || 0);
  const spent = sum(accPlan, x => x.q * priceKRW(x.h));
  const T = sum(hs, valueOf) + spent;
  document.getElementById('a-plan').innerHTML = `<div class="plan">
    ${accPlan.map((x, i) => {
      const after = pct(valueOf(x.h) + x.q * priceKRW(x.h), T), tg = tsum ? (+x.h.target || 0) / tsum * 100 : 0;
      return `<div class="prow"><div class="nm"><b>${esc(x.h.name)}</b><span>${price(x.h, x.h.price)} · 매수 후 ${f1(after)}% / 목표 ${f1(tg)}%</span></div>
        <input type="number" inputmode="numeric" min="0" value="${x.q}" onchange="accPlan[${i}].q=Math.max(0,num(this.value));renderPlan()">
        <div class="amt">${x.q ? short(x.q * priceKRW(x.h)) : '-'}</div></div>`;
    }).join('')}
    <div class="ptotal"><span>매수 합계</span><b>${won(spent)}</b></div>
    <div class="ptotal"><span class="label">남는 금액</span><span class="${amt - spent < 0 ? 'up' : ''}">${won(amt - spent)}</span></div>
    <div class="hint">수량은 직접 바꿀 수 있어요. 실제로 매수한 뒤 아래 버튼을 누르면 현재가 기준으로 수량·평단이 반영돼요.</div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" style="flex:2" onclick="applyPlan()" ${spent > 0 ? '' : 'disabled'}>✅ 매수 완료! 기록하기</button></div>
  </div>`;
}
function applyPlan(){
  let n = 0;
  accPlan.forEach(x => { if(x.q > 0){ applyBuy(x.h, x.q, x.h.price); n++; } });
  save(); closeModal(); render(); toast(`${n}개 종목 매수를 기록했어요 🌱`);
}

/* ---------- members & settings ---------- */
function openMemberAdd(){
  openModal(`<h3>구성원 추가</h3><p class="desc">예: 첫째, 둘째, 부모님 등</p>
    <div class="field"><label>이름</label><input id="m-name" placeholder="이름"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" style="flex:2" onclick="addMember()">추가</button></div>`);
  document.getElementById('m-name').focus();
}
function addMember(){
  const name = document.getElementById('m-name').value.trim();
  if(!name) return toast('이름을 입력해 주세요');
  const m = {id: uid(), name, color: PALETTE[S.members.length % PALETTE.length]};
  S.members.push(m); save(); closeModal(); setView(m.id);
}
function openSettings(){
  openModal(`<h3>설정</h3>
    <div class="sec-title">구성원</div>
    ${S.members.map(m => `<div class="mem-edit"><input type="color" value="${m.color}" data-c="${m.id}"><input value="${esc(m.name)}" data-n="${m.id}">
      <button class="btn danger" style="padding:12px" onclick="delMember('${m.id}')">삭제</button></div>`).join('')}
    <button class="btn soft full" onclick="openMemberAdd()">＋ 구성원 추가</button>
    <div class="sec-title">환율</div>
    <div class="field"><label>1달러 = 몇 원</label><input id="s-fx" type="number" inputmode="decimal" step="any" value="${S.fx}"></div>
    <button class="btn primary full" onclick="saveSettings()">설정 저장</button>
    <div class="sec-title">백업</div>
    <p class="desc" style="margin-bottom:10px">데이터는 이 브라우저에만 저장돼요. 가끔 백업 파일을 받아두세요.</p>
    <div class="grid2"><button class="btn" onclick="exportData()">⬇️ 백업 받기</button>
      <label class="btn" style="cursor:pointer">⬆️ 불러오기<input type="file" accept=".json" hidden onchange="importData(this)"></label></div>
    <div class="sec-title"></div>
    <button class="btn danger full" onclick="resetAll()">전체 데이터 초기화</button>`);
}
function saveSettings(){
  document.querySelectorAll('[data-n]').forEach(i => { const m = member(i.dataset.n); if(m && i.value.trim()) m.name = i.value.trim(); });
  document.querySelectorAll('[data-c]').forEach(i => { const m = member(i.dataset.c); if(m) m.color = i.value; });
  const fx = num(document.getElementById('s-fx').value); if(fx > 0) S.fx = fx;
  save(); closeModal(); render(); toast('저장했어요');
}
function delMember(id){
  const m = member(id), n = holdingsOf(id).length;
  if(!confirm(`'${m.name}'을(를) 삭제할까요?${n ? `\n보유 종목 ${n}개도 함께 삭제돼요.` : ''}`)) return;
  S.members = S.members.filter(x => x.id !== id);
  S.holdings = S.holdings.filter(h => h.memberId !== id);
  S.history = S.history.filter(h => h.memberId !== id);
  save(); render(); openSettings();
}
function exportData(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}));
  a.download = `우리집주식_백업_${today()}.json`; a.click();
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.members || !d.holdings) throw 0;
      if(!confirm('현재 데이터를 백업 파일로 바꿀까요?')) return;
      d.history = d.history || []; S = d; save(); closeModal(); render(); toast('불러왔어요');
    }catch(e){ toast('올바른 백업 파일이 아니에요'); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('모든 데이터를 지울까요? 되돌릴 수 없어요.')) return;
  S = defaultData(); save(); closeModal(); setView('all');
}
function loadSample(){
  const [a, b, c] = S.members;
  const add = (m, name, ticker, currency, qty, avg, price, target) => m && S.holdings.push({id: uid(), memberId: m.id, name, ticker, currency, qty, avg, price, target});
  add(a, '삼성전자', '005930', 'KRW', 50, 68000, 72000, 30);
  add(a, 'S&P500 ETF', 'VOO', 'USD', 8, 480, 540, 50);
  add(a, '나스닥100 ETF', 'QQQ', 'USD', 3, 450, 510, 20);
  add(b, 'S&P500 ETF', 'VOO', 'USD', 4, 500, 540, 60);
  add(b, 'KODEX 200', '069500', 'KRW', 40, 35000, 37000, 40);
  add(c, 'S&P500 ETF', 'VOO', 'USD', 2, 520, 540, 70);
  add(c, '삼성전자', '005930', 'KRW', 10, 70000, 72000, 30);
  save(); render(); toast('예시 데이터를 넣었어요. 설정에서 초기화할 수 있어요');
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
render();
</script>
