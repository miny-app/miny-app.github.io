<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>miny-app</title>
  <meta name="description" content="miny-app 단일 페이지 모음">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --card: #ffffff;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #292524;
        --card: #1c1917;
        --accent: #a5b4fc;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 40px;
      color: var(--muted);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    a.page {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s;
    }
    a.page:hover, a.page:focus-visible { border-color: var(--accent); outline: none; }
    .name { font-weight: 600; }
    .path { color: var(--muted); font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .empty {
      padding: 24px 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>miny-app</h1>
    <p class="sub">단일 페이지 모음</p>

    <!-- 이 목록은 miny-ai가 DB 기준으로 다시 만듭니다. 마커 사이를 직접 고치지 마세요. -->
    <ul id="pages">
      <!-- miny:pages:start -->
      <li>
        <a class="page" href="./budget/">
          <div class="name">주간 가계부</div>
          <div class="path">/budget/</div>
        </a>
      </li>
      <li>
        <a class="page" href="./app-vmmrx/">
          <div class="name">냉장고 식단표</div>
          <div class="path">/app-vmmrx/</div>
        </a>
      </li>
      <li>
        <a class="page" href="./app-85p83/">
          <div class="name">구름 비행</div>
          <div class="path">/app-85p83/</div>
        </a>
      </li>
      <li>
        <a class="page" href="./app-qqps0/">
          <div class="name">벽돌적금</div>
          <div class="path">/app-qqps0/</div>
        </a>
      </li>
      <li>
        <a class="page" href="./app-a6ky5/">
          <div class="name">차곡차곡 우리집 주식</div>
          <div class="path">/app-a6ky5/</div>
        </a>
      </li>
      <li>
        <a class="page" href="./app-9nqq0/">
          <div class="name">비중모아</div>
          <div class="path">/app-9nqq0/</div>
        </a>
      </li>
      <!-- miny:pages:end -->
    </ul>

    <footer>
      <a href="https://github.com/miny-app/miny-app.github.io">GitHub</a>
    </footer>
  </main>
</body>
</html>
