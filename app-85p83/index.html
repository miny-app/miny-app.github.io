<style>

  .chip { background: rgba(20,50,90,.5); color: #fff; border-radius: 14px; padding: 5px 10px; font-size: 13px;

  #tfBtn { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 52px); width: 78px; height: 78px;

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;

  #startScreen { background: linear-gradient(180deg, rgba(20,60,110,.6) 0%, rgba(20,60,110,.35) 60%, rgba(20,60,110,0) 85%); }
  .screen > .wrap { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 440px; }
  #startScreen > .wrap { margin: 6vh 0 auto; }
  .hidden { display: none !important; }

    background: #ffcf3f; color: #6a3d00; box-shadow: 0 6px 0 #d99a00; }

  button.ghost { padding: 10px 22px; font-size: 15px; font-weight: 800; border: 2px solid rgba(255,255,255,.7);
    border-radius: 30px; background: rgba(255,255,255,.12); color: #fff; }
  #cards { display: flex; gap: 8px; width: 100%; }
  .card { flex: 1; min-width: 0; background: #fff; color: #234; border: none; border-radius: 16px; padding: 12px 6px;

  .card .ic { font-size: 32px; }

  .slot.can { border: 3px solid #ffcf3f; background: rgba(255,207,63,.25); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .pod .mn { font-weight: 900; font-size: 14px; min-height: 20px; }

  #codexList { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .cx { background: rgba(255,255,255,.15); border-radius: 12px; padding: 8px; text-align: left; }

    background: #3d7fbf; text-align: center; padding: 20px; line-height: 1.6; }

<script type="module">
import * as THREE from 'three';
window.__skyReady = true;

const KEY = 'app-85p83:best';
const FOUND_KEY = 'app-85p83:found';
const $ = id => document.getElementById(id);
const canvas = $('c');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, k) => a + (b - a) * k;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
};
let best = Number(store.get(KEY) || 0) || 0;
let found = new Set();
try { found = new Set(JSON.parse(store.get(FOUND_KEY) || '[]')); } catch (e) {}

// =====================================================================
//  3D 기본 설정
// =====================================================================
const S = 0.05;                       // 게임 1px = 0.05 월드 유닛
let W = window.innerWidth, H = window.innerHeight;
const wx = x => (x - W / 2) * S;
const wz = y => (y - H / 2) * S;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const SKY = new THREE.Color('#9dd3f7');
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY, 60, 160);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 700);
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x3f74a8, 1.7));
const sunLight = new THREE.DirectionalLight(0xfff2dc, 2.6);
sunLight.position.set(7, 14, 4);
scene.add(sunLight);

const camBase = new THREE.Vector3(), camTarget = new THREE.Vector3();
const TILT = 0.6;
function fitCamera() {
  camera.aspect = W / H; camera.updateProjectionMatrix();
  const hw = W * S / 2, hh = H * S / 2;
  const dv = new THREE.Vector3(0, Math.cos(TILT), Math.sin(TILT));
  const v = new THREE.Vector3();
  let tz = 0, d = 40;
  const place = dd => { camera.position.set(0, 0, tz).addScaledVector(dv, dd); camera.lookAt(0, 0, tz); camera.updateMatrixWorld(); };
  const pr = (x, z) => v.set(x, 0, z).project(camera);
  const corners = [[-hw, -hh], [hw, -hh], [-hw, hh], [hw, hh]];
  const fits = () => corners.every(([x, z]) => { pr(x, z); return v.z < 1 && Math.abs(v.x) <= 1 && Math.abs(v.y) <= 0.97; });
  for (let it = 0; it < 5; it++) {
    let lo = 1, hi = 1500;
    for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; place(mid); if (fits()) hi = mid; else lo = mid; }
    d = hi; place(d);
    const yt = pr(0, -hh).y, yb = pr(0, hh).y;
    tz -= (yt + yb) / 2 * hh * 0.6;
  }
  place(d);
  camBase.copy(camera.position); camTarget.set(0, 0, tz);
  scene.fog.near = d * 1.3; scene.fog.far = d * 3.4;
}

// ---------- 공용 리소스 ----------
function makeGlowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.75)');
  gr.addColorStop(0.6, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function emojiTex(ch) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.font = '92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 64, 72);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = makeGlowTex();
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: 0.5, metalness: 0.2 }, o));
const basicCache = new Map();
const basicMat = c => { let m = basicCache.get(c); if (!m) { m = new THREE.MeshBasicMaterial({ color: c }); basicCache.set(c, m); } return m; };
const glowCache = new Map();
function glowMat(color, opacity) {
  const k = color + '|' + opacity; let m = glowCache.get(k);
  if (!m) { m = new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }); glowCache.set(k, m); }
  return m;
}
function glowSprite(color, size, opacity = 1, own = false) {
  const s = new THREE.Sprite(own ? new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }) : glowMat(color, opacity));
  s.scale.setScalar(size); return s;
}
const GEO = {};
const geo = (k, fn) => GEO[k] || (GEO[k] = fn());
function wingGeo(span, root, tip, sweep, thick = 0.06) {
  const s = new THREE.Shape();
  s.moveTo(0, -root / 2); s.lineTo(span, sweep - tip / 2); s.lineTo(span, sweep + tip / 2); s.lineTo(0, root / 2); s.lineTo(0, -root / 2);
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false });
  g.rotateX(Math.PI / 2); g.translate(0, thick / 2, 0);
  return g;
}
const colorCache = new Map();
const col = c => { let v = colorCache.get(c); if (!v) { v = new THREE.Color(c); colorCache.set(c, v); } return v; };

// ---------- 오브젝트 풀 (프레임마다 재배치) ----------
const pools = new Map();
function poolGet(key, make) {
  let p = pools.get(key);
  if (!p) { p = { list: [], used: 0 }; pools.set(key, p); }
  if (p.used < p.list.length) { const o = p.list[p.used++]; o.visible = true; return o; }
  const o = make(); scene.add(o); p.list.push(o); p.used++; return o;
}
function poolsBegin() { for (const p of pools.values()) p.used = 0; }
function poolsEnd() { for (const p of pools.values()) for (let i = p.used; i < p.list.length; i++) p.list[i].visible = false; }

// =====================================================================
//  환경: 바다, 섬, 구름
// =====================================================================
const OCEAN_Y = -46;
const oGeo = new THREE.PlaneGeometry(560, 560, 48, 48); oGeo.rotateX(-Math.PI / 2);
const oPos = oGeo.attributes.position; const oBase = Float32Array.from(oPos.array);
const ocean = new THREE.Mesh(oGeo, new THREE.MeshStandardMaterial({ color: '#2a8ad0', roughness: 0.28, metalness: 0.15, flatShading: true }));
ocean.position.set(0, OCEAN_Y, -80); ocean.frustumCulled = false;
scene.add(ocean);
function updateOcean(t) {
  const a = oPos.array;
  for (let i = 0; i < a.length; i += 3) {
    const x = oBase[i], z = oBase[i + 2];
    a[i + 1] = Math.sin(x * 0.07 + t * 1.1) * 1.1 + Math.sin((z - t * 9) * 0.09) * 1.3 + Math.sin((x + z) * 0.13 + t * 1.7) * 0.5;
  }
  oPos.needsUpdate = true;
}

const islands = [];
const sandMat = std('#f2dca4'), grassMat = std('#4fb35a'), rockMat = std('#7d8a7a'), palmMat = std('#2f8f3a');
function makeIsland() {
  const g = new THREE.Group();
  const r = rand(4, 10);
  const sand = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.25, 1.2, 9), sandMat); g.add(sand);
  const hill = new THREE.Mesh(new THREE.ConeGeometry(r * 0.85, r * rand(0.5, 1.1), 8), grassMat); hill.position.y = r * 0.35; g.add(hill);
  if (Math.random() < 0.5) { const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(r * 0.3, 0), rockMat); rk.position.set(r * 0.5, 0.6, r * 0.3); g.add(rk); }
  for (let i = 0; i < 3; i++) {
    const p = new THREE.Mesh(geo('palm', () => new THREE.ConeGeometry(0.9, 2.6, 6)), palmMat);
    const a = rand(0, Math.PI * 2); p.position.set(Math.cos(a) * r * 0.75, 1.6, Math.sin(a) * r * 0.75); g.add(p);
  }
  g.rotation.y = rand(0, Math.PI * 2);
  scene.add(g); return g;
}
for (let i = 0; i < 6; i++) { const g = makeIsland(); g.position.set(rand(-90, 90), OCEAN_Y + 0.3, rand(-260, 40)); islands.push(g); }

const cloudMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true, emissive: '#d4e8f8', emissiveIntensity: 0.4 });
const cloudMatHi = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true, emissive: '#ffffff', emissiveIntensity: 0.5, transparent: true, opacity: 0.32, depthWrite: false });
const clouds = [];
function makeCloud(high) {
  const g = new THREE.Group();
  const n = 4 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo('puff', () => new THREE.IcosahedronGeometry(1, 1)), high ? cloudMatHi : cloudMat);
    const s = rand(1.6, 3.4);
    m.scale.set(s, s * 0.62, s * rand(0.8, 1.1));
    m.position.set(rand(-4.5, 4.5), rand(-0.4, 0.8), rand(-2.5, 2.5));
    g.add(m);
  }
  g.userData.high = high;
  scene.add(g); return g;
}
function placeCloud(c, initial) {
  const hw = W * S / 2, hh = H * S / 2;
  if (c.userData.high) {
    const side = Math.random() < 0.5 ? -1 : 1;
    c.position.set(side * rand(hw * 0.75, hw + 8), rand(4, 6), initial ? rand(-hh - 40, hh) : -hh - rand(30, 70));
    c.userData.v = rand(24, 30);
  } else {
    const y = rand(-30, -9);
    c.position.set(rand(-hw - 25, hw + 25), y, initial ? rand(-hh - 70, hh + 15) : -hh - rand(60, 90));
    c.userData.v = 10 + (30 + y) * 0.45;
  }
  c.rotation.y = rand(0, Math.PI);
}
for (let i = 0; i < 16; i++) clouds.push(makeCloud(false));
for (let i = 0; i < 3; i++) clouds.push(makeCloud(true));

function updateEnv(dt, t) {
  updateOcean(t);
  const hh = H * S / 2;
  for (const c of clouds) {
    c.position.z += c.userData.v * dt;
    if (c.position.z > hh + 30) placeCloud(c, false);
  }
  for (const g of islands) {
    g.position.z += 9 * dt;
    if (g.position.z > 70) { g.position.z = rand(-300, -240); g.position.x = rand(-100, 100); }
  }
}

const PL = (() => {
  const root = new THREE.Group(); root.rotation.order = 'YXZ';

  const engGlow = glowSprite('#ffb15a', 1.6, 0.9); engGlow.position.z = 1.55; hull.add(engGlow);

  // 날개
  const wGeo = wingGeo(1.55, 1.35, 0.42, 0.62);
  const wings = [];
  for (const s of [-1, 1]) {
    const wg = new THREE.Group(); body.add(wg); wings.push(wg);
    mk(wGeo, mB, wg).scale.x = s;
    mk(new THREE.BoxGeometry(0.08, 0.08, 0.5), mY, wg, s * 1.55, 0, 0.62);
    mk(new THREE.BoxGeometry(0.5, 0.07, 0.1), mW, wg, s * 0.75, 0.02, -0.05);

    pose(wg, { p: [s * 0.3, -0.04, 0.15], r: [0, 0, 0] }, { p: [s * 0.32, 2.25, 0.6], r: [-0.35, 0, s * 1.05] }, [0.2, 0.8]);

  // 미사일 포드

  for (const s of [-1, 1]) {

      o.position.set(lerp(A.p[0], B.p[0], k), lerp(A.p[1], B.p[1], k), lerp(A.p[2], B.p[2], k));

      const s = lerp(A.s ?? 1, B.s ?? 1, k);

function makeBulletModel(kind, color) {
  const g = new THREE.Group(); const ud = g.userData = {};
  const add = (gm, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(gm, mat); m.position.set(x, y, z); g.add(m); return m; };
  switch (kind) {
    case 'dot':
      add(geo('bDot', () => new THREE.CylinderGeometry(0.35, 0.35, 3, 6).rotateX(Math.PI / 2)), basicMat(color));
      g.add(glowSprite(color, 4.5, 0.85)); break;
    case 'flame':
      ud.a = glowSprite(color, 1, 1, true); ud.b = glowSprite('#ffe14d', 1, 1, true); g.add(ud.a, ud.b); break;
    case 'spark':
      add(geo('sph', () => new THREE.SphereGeometry(1, 10, 8)), basicMat('#ffffff'));
      g.add(glowSprite(color, 5, 1)); break;
    case 'shard': {
      const m = add(geo('oct', () => new THREE.OctahedronGeometry(1, 0)), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6, flatShading: true, roughness: 0.1, metalness: 0.3 }));
      m.scale.set(0.7, 0.7, 2.4); g.add(glowSprite(color, 3, 0.6)); break;
    }
    case 'missile': {
      const m = std(color, { emissive: color, emissiveIntensity: 0.25 });
      add(geo('mBody', () => new THREE.CylinderGeometry(0.32, 0.32, 2.2, 8).rotateX(Math.PI / 2)), m);
      add(geo('mNose', () => new THREE.ConeGeometry(0.32, 0.8, 8).rotateX(Math.PI / 2)), std('#ffffff'), 0, 0, 1.5);
      add(geo('mFin1', () => new THREE.BoxGeometry(1.3, 0.08, 0.5)), MAT_DARK, 0, 0, -0.9);
      add(geo('mFin2', () => new THREE.BoxGeometry(0.08, 1.3, 0.5)), MAT_DARK, 0, 0, -0.9);
      const f = glowSprite('#ffcf3f', 3, 1); f.position.z = -1.6; g.add(f); ud.f = f; break;
    }
    case 'bomb':
      add(geo('sph', () => new THREE.SphereGeometry(1, 10, 8)), std('#333a44', { metalness: 0.6, roughness: 0.3 }));
      ud.blink = glowSprite(color, 3.6, 1, true); g.add(ud.blink); break;
    case 'orb':
      add(geo('sph', () => new THREE.SphereGeometry(1, 10, 8)), basicMat(color));
      g.add(glowSprite(color, 3.6, 0.9)); break;
    case 'rail':
      add(geo('rail1', () => new THREE.BoxGeometry(0.8, 0.8, 1).translate(0, 0, -0.5)), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
      add(geo('rail2', () => new THREE.BoxGeometry(0.35, 0.35, 1).translate(0, 0, -0.5)), basicMat('#ffffff'));
      break;
  }
  return g;
}

const hpMul = () => 1 + (level - 1) * 0.3;
const spdMul = () => Math.min(1.8, 1 + (level - 1) * 0.06);
const ebSpeed = () => Math.min(440, 220 + level * 15);

function makeEnemy(type, x, y = -40) {
  const e = { x, y, t: 0, type, slowT: 0, burnT: 0, burnDps: 0, flash: 0, seed: Math.random() * 10 };
  const sm = spdMul();
  if (type === 'basic') Object.assign(e, { r: 16, hp: 1.5, vy: rand(130, 180) * sm, pts: 10, color: '#e9545a' });
  if (type === 'zig') Object.assign(e, { r: 15, hp: 1.5, vy: 130 * sm, amp: rand(60, 110), pts: 20, color: '#9b59d6' });
  if (type === 'shooter') Object.assign(e, { r: 18, hp: 5, vy: 75, pts: 40, color: '#2f8f5b', cd: rand(0.6, 1.2) });
  if (type === 'dasher') Object.assign(e, { r: 15, hp: 3, vy: 200, pts: 35, color: '#ff8c1a', stopY: rand(70, H * 0.35), phase: 0 });
  if (type === 'ringer') Object.assign(e, { r: 22, hp: 12, vy: 120, pts: 80, color: '#1f9aa8', stopY: rand(90, 190), stay: 4.5, cd: 0.8, phase: 0 });
  if (type === 'big') Object.assign(e, { r: 30, hp: 22, vy: 45, pts: 150, color: '#6b7488', cd: 1.2 });
  if (type === 'zig') e.ox = clamp(x, e.amp + 10, W - e.amp - 10);
  e.hp *= hpMul(); e.maxHp = e.hp;
  enemies.push(e);
  return e;
}

function spawnEnemy() {
  const L = level;

    const n = 5, cx = rand(90, W - 90), gap = Math.min(44, (W - 60) / n);
    for (let i = 0; i < n; i++) makeEnemy('basic', clamp(cx + (i - 2) * gap, 20, W - 20), -40 - Math.abs(i - 2) * 30).vy = 170 * spdMul();
    return;
  }
  const r = Math.random();
  let type = 'basic';
  if (L >= 2 && r < 0.26) type = 'zig';
  else if (L >= 2 && r < 0.44) type = 'shooter';
  else if (L >= 3 && r < 0.57) type = 'dasher';
  else if (L >= 5 && r < 0.64) type = 'ringer';
  else if (L >= 4 && r < 0.70) type = 'big';
  makeEnemy(type, rand(30, W - 30));
}

function explode(x, y, color, n = 14) {

// ---------- 전투 ----------
const dmgMul = () => 1 + 0.25 * modLv;

function fireMain() {
  const add = (dx, vx) => shot({ x: player.x + dx, y: player.y - 22, vx, vy: -640, r: 4 });
  if (power === 0) add(0, 0);
  else if (power === 1) { add(-7, 0); add(7, 0); }
  else if (power === 2) { add(0, 0); add(-8, -110); add(8, 110); }
  else if (power === 3) { add(-6, 0); add(6, 0); add(-10, -160); add(10, 160); }
  else { add(-6, 0); add(6, 0); add(0, 0); add(-10, -170); add(10, 170); }
}

function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flash = 0.05;
  if (e.hp <= 0) kill(e);
}

function status(e, b) {
  if (b.burn) { e.burnT = Math.max(e.burnT, b.burn); e.burnDps = Math.max(e.burnDps, 2.2 * dmgMul()); }
  if (b.slow) e.slowT = Math.max(e.slowT, b.slow);
}

function kill(e) {
  e.dead = true; score += e.pts;
  explode(e.x, e.y, e.color, e.type === 'boss' ? 80 : e.type === 'big' ? 40 : 14);
  explode(e.x, e.y, '#ffcf3f', e.type === 'boss' ? 30 : 6);
  rings.push({ x: e.x, y: e.y, r: 0, max: e.r * 1.6, t: 0, color: '#ffb340' });
  if (e.type === 'boss') {
    boss = null;
    for (let i = 0; i < 6; i++) rings.push({ x: e.x + rand(-40, 40), y: e.y + rand(-30, 30), r: 0, max: rand(60, 110), t: 0, color: '#ffcf3f' });
    eBullets = [];
    items.push({ x: e.x - 20, y: e.y, kind: 'life' }, { x: e.x + 20, y: e.y, kind: 'shield' });
    pendingPicks++; pickDelay = 1.2;
    nextBossAt = time + 60;
    if (mechT <= 0) tf = 100;
    shake = 1;
    toast(`🏆 보스 격파! +${e.pts}`);
    return;
  }
  if (e.type === 'big') shake = Math.max(shake, 0.35);
  if (mechT <= 0) tf = Math.min(100, tf + e.pts * 0.3);
  addXp(Math.ceil(e.pts * 0.9));
  dropItem(e.x, e.y);
  if (e.type === 'big') items.push({ x: e.x, y: e.y, kind: Math.random() < 0.5 ? 'shield' : 'life' });
}

function addXp(v) {
  xp += v;
  while (xp >= xpNeed) {
    xp -= xpNeed; xpNeed = Math.round(xpNeed * 1.4 + 40);
    pendingPicks++;
  }
}

function nearestEnemy(x, y, exclude, maxD = Infinity) {
  let bestE = null, bd = maxD * maxD;
  for (const e of enemies) {
    if (e.dead || e.y < -20 || (exclude && exclude.has(e))) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; bestE = e; }
  }
  return bestE;
}

function chainFrom(e, b) {
  const hit = new Set([e]);
  let cur = e;
  for (let k = 0; k < b.chain; k++) {
    const n = nearestEnemy(cur.x, cur.y, hit, 170);
    if (!n) break;
    bolts.push({ x1: cur.x, y1: cur.y, x2: n.x, y2: n.y, t: 0.15 });
    damage(n, b.dmg * 0.7); status(n, b);
    hit.add(n); cur = n;
  }
}

let spawned = [];
function detonate(b) {
  rings.push({ x: b.x, y: b.y, r: 0, max: b.boom, t: 0, color: b.color });
  for (const e of enemies) {
    if (e.dead) continue;
    if (dist2(e, b) < (b.boom + e.r) ** 2) { damage(e, b.dmg); status(e, b); }
  }
  if (b.emp) {
    for (const eb of eBullets) if (dist2(eb, b) < (b.boom * 1.3) ** 2) { eb.dead = true; explode(eb.x, eb.y, '#7fb8ff', 2); }
  }
  if (b.split) {
    for (let k = 0; k < b.split; k++) {
      const a = k / b.split * Math.PI * 2;
      spawned.push({ x: b.x, y: b.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, dmg: b.dmg * 0.5, r: 4, kind: 'dot', color: b.color, pierce: 0, life: 0.6, t: 0, h0: 0 });
    }
  }
  explode(b.x, b.y, b.color, 10);
}

function onHit(b, e) {
  if (b.boom) { detonate(b); b.dead = true; return; }
  damage(e, b.dmg); status(e, b);
  if (b.chain) chainFrom(e, b);
  if (b.pierce > 0) { b.pierce--; (b.hit || (b.hit = new Set())).add(e); }
  else b.dead = true;
}

function hitPlayer() {
  if (invuln > 0 || mechT > 0) return;
  if (shield > 0) { shield = 0; invuln = 1; explode(player.x, player.y, '#7fdcff', 18); shake = 0.3; return; }
  lives--; invuln = 2;
  explode(player.x, player.y, '#ffb340', 26);
  shake = 0.7; hurtA = 1;
  if (navigator.vibrate) navigator.vibrate(120);
  updateHud();
  if (lives <= 0) gameOver();
}

function updateEnemy(e, dt) {
  const sp = e.slowT > 0 ? (e.type === 'boss' ? 0.75 : 0.4) : 1;
  if (e.slowT > 0) e.slowT -= dt;
  if (e.burnT > 0) {
    e.burnT -= dt; damage(e, e.burnDps * dt);
    if (Math.random() < 0.3) particles.push({ x: e.x + rand(-e.r, e.r) * .6, y: e.y, h: 0.4, vx: 0, vy: -30, vh: 3, life: .35, max: .35, color: '#ff7a2f', r: 3 });
  }
  const sdt = dt * sp;
  e.t += sdt;
  const bs = ebSpeed();
  const aim = () => Math.atan2(player.y - e.y, player.x - e.x);

  switch (e.type) {
    case 'basic': e.y += e.vy * sdt; break;
    case 'zig': e.y += e.vy * sdt; e.x = e.ox + Math.sin(e.t * 3) * e.amp; break;
    case 'shooter':
    case 'big':
      e.y += e.vy * sdt; e.cd -= sdt;
      if (e.cd <= 0 && e.y > 0 && e.y < H * 0.75) {
        const a = aim();
        if (e.type === 'big') {
          const n = level >= 7 ? 7 : 5;
          for (let k = 0; k < n; k++) eShoot(e.x, e.y + 20, a + (k - (n - 1) / 2) * 0.22, bs);
          e.cd = 1.4;
        } else {
          if (level >= 6) for (let k = -1; k <= 1; k++) eShoot(e.x, e.y + 14, a + k * 0.2, bs);
          else eShoot(e.x, e.y + 14, a, bs);
          e.cd = rand(1.2, 2.0);
        }
      }
      break;
    case 'dasher':
      if (e.phase === 0) { e.y += e.vy * sdt; if (e.y >= e.stopY) { e.phase = 1; e.wait = 0.6; e.aimA = aim(); } }
      else if (e.phase === 1) {
        e.wait -= sdt; e.aimA = aim();
        if (e.wait <= 0) { e.phase = 2; const s = 480 * spdMul(); e.dvx = Math.cos(e.aimA) * s; e.dvy = Math.sin(e.aimA) * s; }
      } else { e.x += e.dvx * sdt; e.y += e.dvy * sdt; }
      break;
    case 'ringer':
      if (e.phase === 0) { e.y += e.vy * sdt; if (e.y >= e.stopY) e.phase = 1; }
      else if (e.phase === 1) {
        e.stay -= sdt; e.cd -= sdt;
        if (e.cd <= 0) {
          const n = 10 + Math.min(8, level), off = rand(0, 1);
          for (let k = 0; k < n; k++) eShoot(e.x, e.y, (k + off) / n * Math.PI * 2, bs * 0.7);
          e.cd = 1.4;
        }
        if (e.stay <= 0) e.phase = 2;
      } else e.y += 70 * sdt;
      break;
    case 'boss': {
      if (e.y < 120) e.y += 70 * dt;
      e.x = W / 2 + Math.sin(e.t * 0.6) * (W / 2 - 60);
      if (e.y < 100) break;
      e.cd -= sdt;
      if (e.cd > 0) break;
      const p = e.pat % 3;
      if (p === 0) {
        const n = 7 + bossN * 2, a = aim();
        for (let k = 0; k < n; k++) eShoot(e.x, e.y + 30, a + (k - (n - 1) / 2) * 0.13, bs);
        e.step++; e.cd = e.step < 3 ? 0.3 : 1.1;
      } else if (p === 1) {
        const n = 16 + bossN * 4;
        for (let k = 0; k < n; k++) eShoot(e.x, e.y, (k + e.step * 0.5) / n * Math.PI * 2, bs * 0.75, 6);
        e.step++; e.cd = e.step < 3 ? 0.5 : 1.1;
      } else {
        const arms = 2 + bossN;
        for (let k = 0; k < arms; k++) eShoot(e.x, e.y, e.step * 0.3 + k / arms * Math.PI * 2, bs * 0.8);
        e.step++; e.cd = e.step < 26 ? 0.08 : 1.3;
      }
      if ((p === 0 && e.step >= 3) || (p === 1 && e.step >= 3) || (p === 2 && e.step >= 26)) { e.step = 0; e.pat++; }
      break;
    }
  }
  if (e.y > H + 60 || e.x < -80 || e.x > W + 80 || (e.t > 2 && e.y < -120)) if (e.type !== 'boss') { e.dead = true; e.gone = true; }
}

let beamOn = false;
function update(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.h += p.vh * dt; p.vh -= 9 * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) { r.t += dt; r.r = r.max * Math.min(1, r.t / 0.18); }
  rings = rings.filter(r => r.t < 0.35);
  for (const b of bolts) b.t -= dt;
  bolts = bolts.filter(b => b.t > 0);
  beamOn = false;
  if (state !== 'play') return;

  time += dt;
  const newLevel = 1 + Math.floor(time / 15);
  if (newLevel !== level) { level = newLevel; toast(`레벨 ${level}`); }
  if (invuln > 0) invuln -= dt;
  if (shield > 0) shield -= dt;
  if (mechT > 0) {
    mechT -= dt;
    if (mechT <= 0) { mechT = 0; invuln = Math.max(invuln, 1.2); toast('변신 해제'); }
  } else tf = Math.min(100, tf + dt * 0.8);

  const ks = 400 * dt;
  if (keys.ArrowLeft) player.x -= ks;
  if (keys.ArrowRight) player.x += ks;
  if (keys.ArrowUp) player.y -= ks;
  if (keys.ArrowDown) player.y += ks;
  player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 80, H - 50);

  // 발사
  launchH = morph * 2.0;
  const mech = mechT > 0;
  fireTimer -= dt;
  if (!mech && fireTimer <= 0) { fireMain(); fireTimer = 0.15; }
  const m = dmgMul(), cdm = 1 - 0.07 * modLv;
  for (let i = 0; i < 2; i++) {
    const k = podKey(pods[i]);
    if (!k) continue;
    podCd[i] -= dt;
    if (podCd[i] <= 0) { MS[k].fire(player.x + (i ? 14 : -14), player.y, m); podCd[i] = MS[k].cd * cdm * (mech ? 0.5 : 1); }
  }
  // 빔 캐논
  if (mech && morph > 0.9) {
    beamOn = true;
    const bw = 18;
    const dps = (16 + level * 2) * dmgMul() * (1 + 0.2 * mechLv);
    for (const e of enemies) {
      if (e.dead || e.y > player.y || e.y < -30) continue;
      if (Math.abs(e.x - player.x) < bw + e.r) {
        damage(e, dps * dt);
        if (Math.random() < 0.35) particles.push({ x: e.x + rand(-8, 8), y: e.y + e.r * 0.6, h: 0.6, vx: rand(-120, 120), vy: rand(20, 160), vh: rand(1, 5), life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ffffff' : '#7ff7ff', r: rand(2, 3.5) });
      }
    }
  }

  // 스폰
  if (!boss && time >= nextBossAt) spawnBoss();
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.22, 0.85 - level * 0.06) * rand(0.6, 1.1) * (boss ? 2.8 : 1);
  }

  // 아군 탄
  spawned = [];
  for (const b of bullets) {
    b.t += dt;
    if (b.homing) {
      if (!b.tgt || b.tgt.dead) b.tgt = nearestEnemy(b.x, b.y);
      let ang = Math.atan2(b.vy, b.vx);
      let sp = Math.hypot(b.vx, b.vy);
      if (b.tgt) {
        let diff = Math.atan2(b.tgt.y - b.y, b.tgt.x - b.x) - ang;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        ang += clamp(diff, -b.homing * dt, b.homing * dt);
      } else {
        let diff = -Math.PI / 2 - ang;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        ang += clamp(diff, -3 * dt, 3 * dt);
      }
      sp = Math.min(b.maxSp, sp + 700 * dt);
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
      if (Math.random() < 0.6) particles.push({ x: b.x, y: b.y, h: bulletH(b), vx: 0, vy: 0, vh: 0.5, life: .25, max: .25, color: '#ffffff', r: 2.5 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.t > b.life) { if (b.boom) detonate(b); b.dead = true; }
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) b.dead = true;
  }

  for (const e of enemies) updateEnemy(e, dt);

  for (const b of eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  eBullets = eBullets.filter(b => b.y < H + 20 && b.y > -40 && b.x > -20 && b.x < W + 20);

  for (const it of items) { it.y += 90 * dt; it.t = (it.t || 0) + dt; }

  // 충돌: 탄-적
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead || (b.hit && b.hit.has(e))) continue;
      if (dist2(b, e) < (e.r + b.r) ** 2) { onHit(b, e); if (b.dead) break; }
    }
  }
  for (const e of enemies) if (e.flash > 0) e.flash -= dt;
  bullets = bullets.filter(b => !b.dead).concat(spawned);

  // 충돌: 적/적탄-플레이어
  const pr = 11;
  for (const e of enemies) {
    if (e.dead) continue;
    if (dist2(e, player) < (e.r * 0.85 + pr) ** 2) {
      if (mech) {
        if (e.type === 'big' || e.type === 'boss' || e.type === 'ringer') damage(e, 20 * dt);
        else damage(e, 999);
        continue;
      }
      if (invuln <= 0 && e.type !== 'big' && e.type !== 'boss' && e.type !== 'ringer') { e.dead = true; explode(e.x, e.y, e.color); }
      hitPlayer();
    }
  }
  if (mech) {
    for (const b of eBullets) if (dist2(b, player) < 48 ** 2) {
      b.dead = true;
      particles.push({ x: b.x, y: b.y, h: 1, vx: rand(-60, 60), vy: rand(-60, 60), vh: 2, life: 0.3, max: 0.3, color: '#ffd34d', r: 3 });
    }
  } else {
    for (const b of eBullets) {
      if (dist2(b, player) < (pr + b.r - 2) ** 2) {
        if (invuln <= 0) b.dead = true;
        hitPlayer();
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  eBullets = eBullets.filter(b => !b.dead);

  for (const it of items) {
    if (dist2(it, player) < 32 ** 2) {
      it.dead = true;
      if (it.kind === 'shield') shield = 8;
      if (it.kind === 'life') lives = Math.min(lives + 1, 5);
      explode(it.x, it.y, '#ffffff', 10);
    }
    if (it.y > H + 30) it.dead = true;
  }
  items = items.filter(i => !i.dead);

  updateHud();
  if (state !== 'play') return;
  if (pickDelay > 0) pickDelay -= dt;
  else if (pendingPicks > 0) { pendingPicks--; openPick(); }
}

// ---------- 부품 선택 ----------
let cards = [], selCard = null;

function makeCards() {
  const pool = [];
  for (const k of ORDER) pool.push({ type: 'part', part: k, w: 3 });
  if (!firstPick) {
    if (power < 4) pool.push({ type: 'gun', w: 2 });
    if (modLv < 5) pool.push({ type: 'mod', w: 2 });
    if (mechLv < 3) pool.push({ type: 'mech', w: 1.5 });
    if (lives < 5) pool.push({ type: 'repair', w: 1 });
  }
  const out = [];
  while (out.length < 3 && pool.length) {
    let total = pool.reduce((s, c) => s + c.w, 0), r = Math.random() * total, i = 0;
    while ((r -= pool[i].w) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function cardInfo(c) {
  if (c.type === 'part') {
    const p = PARTS[c.part];
    return { ic: p.icon, nm: p.name + ' 부품', ds: '단독: ' + MS[c.part].name };
  }
  if (c.type === 'gun') return { ic: '🔫', nm: '메인포 강화', ds: `탄 갈래 증가 (${power + 1}→${power + 2})` };
  if (c.type === 'mod') return { ic: '⚙️', nm: '미사일 강화', ds: '미사일 피해 +25%, 연사 +7%' };
  if (c.type === 'mech') return { ic: '🤖', nm: '변신 강화', ds: `메카 지속 +2초, 빔 피해 +20% (${mechLv}→${mechLv + 1})` };
  return { ic: '❤️', nm: '수리', ds: '생명 +1' };
}

function openPick() {
  state = 'pick'; touchId = null; selCard = null;
  cards = makeCards();
  $('pickTitle').textContent = firstPick ? '출격 준비' : '부품 선택';
  renderPick();
  show('pickScreen');
}

function renderPick() {
  $('pickHint').textContent = selCard && selCard.type === 'part'
    ? '장착할 슬롯을 누르세요 (기존 부품은 교체돼요)'
    : '카드를 하나 고르세요';
  const cw = $('cards'); cw.innerHTML = '';
  cards.forEach(c => {
    const info = cardInfo(c);
    const b = document.createElement('button');
    b.className = 'card' + (selCard === c ? ' sel' : '');
    b.innerHTML = `<div class="ic">${info.ic}</div><div class="nm">${info.nm}</div><div class="ds">${info.ds}</div>`;
    b.onclick = () => chooseCard(c);
    cw.appendChild(b);
  });
  const pw = $('pods'); pw.innerHTML = '';
  pods.forEach((pod, pi) => {
    const k = podKey(pod);
    const d = document.createElement('div'); d.className = 'pod';
    d.innerHTML = `<div class="pt">${pi === 0 ? '왼쪽' : '오른쪽'} 포드</div>`;
    const slots = document.createElement('div'); slots.className = 'slots';
    const canPlace = selCard && selCard.type === 'part';
    pod.forEach((s, si) => {
      const b = document.createElement('button');
      b.className = 'slot' + (canPlace ? ' can' : '');
      b.textContent = s ? PARTS[s].icon : '+';
      b.onclick = () => placePart(pi, si);
      slots.appendChild(b);
    });
    d.appendChild(slots);
    const mn = document.createElement('div'); mn.className = 'mn';
    mn.textContent = k ? MS[k].name : '비어 있음';
    d.appendChild(mn);
    const pv = document.createElement('div'); pv.className = 'pv';
    if (canPlace) {
      const opts = [0, 1].map(si => {
        const np = pod.slice(); np[si] = selCard.part;
        const nk = podKey(np);
        const isNew = nk.length === 2 && !found.has(nk);
        return `${si + 1}칸 → ${MS[nk].name}${isNew ? '<span class="new">NEW</span>' : ''}`;
      });
      pv.innerHTML = opts.join('<br>');
    } else if (k) pv.textContent = MS[k].desc;
    d.appendChild(pv);
    pw.appendChild(d);
  });
}

function chooseCard(c) {
  if (c.type === 'part') { selCard = c; renderPick(); return; }
  if (c.type === 'gun') power = Math.min(4, power + 1);
  if (c.type === 'mod') modLv = Math.min(5, modLv + 1);
  if (c.type === 'mech') { mechLv = Math.min(3, mechLv + 1); if (mechT > 0) { mechT += 2; mechMax += 2; } }
  if (c.type === 'repair') lives = Math.min(5, lives + 1);
  closePick();
}

function placePart(pi, si) {
  if (!selCard || selCard.type !== 'part') return;
  pods[pi][si] = selCard.part;
  podCd[pi] = 0.3;
  const k = podKey(pods[pi]);
  let msg = null;
  if (k.length === 2 && !found.has(k)) {
    found.add(k); store.set(FOUND_KEY, JSON.stringify([...found]));
    msg = `✨ 새 미사일 발견! ${MS[k].name}`;
  } else msg = `${keyIcons(k)} ${MS[k].name} 장착`;
  closePick();
  toast(msg);
}

function closePick() {
  firstPick = false;
  renderPodHud();
  state = 'play'; invuln = Math.max(invuln, 0.8);
  show(null); updateHud();
}

// =====================================================================
//  렌더링
// =====================================================================
const bulletH = b => (b.h0 || 0) * Math.exp(-b.t * 6) + 0.25;

function seg(key, mat, x1, z1, x2, z2, h, w) {
  const o = poolGet(key, () => new THREE.Mesh(geo('boxc', () => new THREE.BoxGeometry(1, 1, 1)), mat));
  const dx = x2 - x1, dz = z2 - z1;
  o.position.set((x1 + x2) / 2, h, (z1 + z2) / 2);
  o.rotation.set(0, Math.atan2(dx, dz), 0);
  o.scale.set(w, w, Math.hypot(dx, dz) || 0.001);
}

function renderPlayer(dt, t) {
  const P = PL;
  const alive = state === 'start' || lives > 0;
  const blink = state === 'play' && invuln > 0 && mechT <= 0 && Math.floor(invuln * 12) % 2 === 0;
  P.root.visible = alive && !blink;
  const X = wx(player.x), Z = wz(player.y);
  const vx = (X - P.lastX) / Math.max(dt, 1e-3), vz = (Z - P.lastZ) / Math.max(dt, 1e-3);
  P.lastX = X; P.lastZ = Z;
  const k = 1 - Math.exp(-dt * 8);
  if (state === 'start') { P.bank = Math.sin(t * 1.2) * 0.3 * (1 - morph); P.pitch = 0; }
  else {
    P.bank = lerp(P.bank, clamp(-vx * 0.05, -0.75, 0.75) * (1 - morph * 0.75), k);
    P.pitch = lerp(P.pitch, clamp(vz * 0.02, -0.25, 0.25) * (1 - morph), k);
  }
  P.root.position.set(X, Math.sin(t * 3) * 0.1 * morph + Math.sin(t * 1.7) * 0.05, Z);
  P.root.rotation.set(P.pitch, 0, P.bank);
  P.applyMorph(morph);
  P.body.scale.setScalar(1 + 0.15 * morph);
  const fl = 0.75 + Math.random() * 0.5;
  P.flame.scale.set(1, 1, fl * (1 + morph * 0.4)); P.flame2.scale.set(1, 1, fl);
  P.engGlow.scale.setScalar(1.4 + Math.random() * 0.4);
  for (const g of P.footGlows) g.scale.setScalar(0.8 + Math.random() * 0.4);

  // 실드
  P.shield.visible = alive && shield > 0 && state !== 'start';
  if (P.shield.visible) {
    P.shield.position.set(X, 0.2 + morph * 1.2, Z);
    P.shield.scale.setScalar(1 + morph * 0.4);
    P.shieldWire.rotation.y = t * 0.8; P.shieldWire.rotation.x = t * 0.5;
    P.shield.children[1].material.opacity = shield < 2 && Math.floor(shield * 8) % 2 ? 0.15 : 0.55;
  }
  // 배리어
  P.barrier.visible = alive && mechT > 0 && morph > 0.5;
  if (P.barrier.visible) {
    P.barrier.position.set(X, 1.3, Z);
    P.barrier.rotation.set(t * 0.6, t * 0.9, 0);
    P.barrier.scale.setScalar(1 + Math.sin(t * 6) * 0.03);
    P.barrier.material.opacity = mechT < 2 && Math.floor(mechT * 6) % 2 ? 0.12 : 0.4;
  }
  // 빔
  P.beam.visible = P.muzzle.visible = beamOn && alive;
  if (P.beam.visible) {
    const sx = X, sy = 1.9, sz = Z - 0.9;
    P.beam.position.set(sx, sy, sz);
    P.beam.lookAt(sx, 0.3, wz(-40));
    const len = Math.hypot(sy - 0.3, sz - wz(-40));
    const w = 0.85 * (1 + Math.sin(t * 40) * 0.1);
    P.beam.scale.set(w, w, len);
    P.muzzle.position.set(sx, sy, sz);
    P.muzzle.scale.setScalar(3.2 + Math.random() * 1.2);
  }
}

function renderEnemy(e, t) {
  const o = poolGet('en_' + e.type, () => makeEnemyModel(e.type, e.color));
  const ud = o.userData;
  const X = wx(e.x), Z = wz(e.y);
  o.position.set(X, Math.sin(e.t * 2 + e.seed) * 0.12, Z);
  o.scale.setScalar(e.r / 16);
  let ry = 0, rz = 0, rx = 0;
  if (e.type === 'zig') rz = Math.cos(e.t * 3) * 0.7;
  else if (e.type === 'dasher') {
    if (e.phase === 1) ry = Math.atan2(Math.cos(e.aimA), Math.sin(e.aimA));
    else if (e.phase === 2) ry = Math.atan2(e.dvx, e.dvy);
  } else if (e.type === 'boss') { rz = Math.sin(e.t * 0.6) * -0.12; rx = -0.15; }
  else if (e.type === 'basic') rz = Math.sin(e.t * 2 + e.seed) * 0.15;
  o.rotation.set(rx, ry, rz);
  if (ud.spin) ud.spin.rotation.y = e.t * 2.5;
  if (ud.ring) ud.ring.rotation.y = t * 1.5;
  if (ud.core) { const p = 1 + Math.sin(t * 6) * 0.15; ud.core.scale.setScalar(p); ud.coreGlow.scale.setScalar(1.6 * p); }
  const b = ud.body;
  if (e.flash > 0) { b.emissive.set('#ffffff'); b.emissiveIntensity = 1.2; }
  else if (e.slowT > 0) { b.emissive.set('#5fcfff'); b.emissiveIntensity = 0.45; }
  else if (e.burnT > 0) { b.emissive.set('#ff5a1f'); b.emissiveIntensity = 0.3 + Math.random() * 0.25; }
  else b.emissiveIntensity = 0;

  if (e.type === 'dasher' && e.phase === 1) {
    seg('aim', aimMat, X, Z, X + Math.cos(e.aimA) * 30, Z + Math.sin(e.aimA) * 30, 0.1, 0.07);
  }
  if (e.slowT > 0) {
    const r = poolGet('slow', () => new THREE.Mesh(geo('slowT', () => new THREE.TorusGeometry(1, 0.06, 6, 28).rotateX(Math.PI / 2)), slowMat));
    r.position.set(X, 0.05, Z); r.scale.setScalar((e.r + 5) * S); r.rotation.y = t;
  }
  if (e.type !== 'boss' && e.maxHp > 2 && e.hp < e.maxHp) {
    const bw = e.r * 2 * S, by = 1.4, bz = Z - e.r * S - 0.35;
    const bg = poolGet('hpbg', () => { const s = new THREE.Sprite(hpBgMat); s.renderOrder = 10; return s; });
    bg.position.set(X, by, bz); bg.scale.set(bw + 0.08, 0.2, 1);
    const fg = poolGet('hpfg', () => { const s = new THREE.Sprite(hpFgMat); s.center.set(0, 0.5); s.renderOrder = 11; return s; });
    fg.position.set(X - bw / 2, by, bz); fg.scale.set(Math.max(0.001, bw * e.hp / e.maxHp), 0.12, 1);
  }
}

function renderBullet(b) {
  const o = poolGet('b_' + b.kind + b.color, () => makeBulletModel(b.kind, b.color));
  const ud = o.userData;
  o.position.set(wx(b.x), bulletH(b), wz(b.y));
  o.rotation.set(0, Math.atan2(b.vx, b.vy), 0);
  const s = b.r * S;
  if (b.kind === 'flame') {
    o.scale.setScalar(1);
    const k = b.t / b.life;
    ud.a.scale.setScalar(s * 3.4 * (1 + k)); ud.a.material.opacity = Math.max(0, 1 - k * 0.85);
    ud.b.scale.setScalar(s * 1.6 * (1 + k * 0.5)); ud.b.material.opacity = Math.max(0, 1 - k);
  } else if (b.kind === 'rail') o.scale.set(s, s, 3.6);
  else o.scale.setScalar(s);
  if (ud.blink) ud.blink.material.opacity = Math.floor(b.t * 10) % 2 ? 1 : 0.35;
  if (ud.f) ud.f.scale.setScalar(2.4 + Math.random() * 1.4);
}

function renderItem(it, t) {
  const key = 'it_' + it.kind;
  const o = poolGet(key, () => {
    const g = new THREE.Group();
    g.add(glowSprite(it.kind === 'shield' ? '#7fdcff' : '#ff7fa8', 2.4, 0.9));
    const bub = new THREE.Mesh(geo('bub', () => new THREE.SphereGeometry(0.72, 16, 12)), new THREE.MeshStandardMaterial({ color: '#ffffff', transparent: true, opacity: 0.35, roughness: 0.1, metalness: 0.2 }));
    g.add(bub);
    const em = new THREE.Sprite(new THREE.SpriteMaterial({ map: it.kind === 'shield' ? TEX_SHIELD : TEX_LIFE, transparent: true }));
    em.scale.setScalar(1.15); g.add(em);
    return g;
  });
  o.position.set(wx(it.x), 0.6 + Math.sin((it.t || 0) * 5) * 0.2, wz(it.y));
}

function renderRing(r) {
  const o = poolGet('ring', () => new THREE.Mesh(geo('sph', () => new THREE.SphereGeometry(1, 10, 8)), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false })));
  o.material.color.set(r.color);
  o.material.opacity = Math.max(0, 1 - r.t / 0.35) * 0.6;
  const s = Math.max(0.01, r.r * S);
  o.position.set(wx(r.x), 0.3, wz(r.y)); o.scale.set(s, s * 0.55, s);
}

function renderBolt(b) {
  const x1 = wx(b.x1), z1 = wz(b.y1), x2 = wx(b.x2), z2 = wz(b.y2);
  const mx = (x1 + x2) / 2 + rand(-0.5, 0.5), mz = (z1 + z2) / 2 + rand(-0.5, 0.5);
  seg('bolt', boltMat, x1, z1, mx, mz, 0.5, 0.1);
  seg('bolt', boltMat, mx, mz, x2, z2, 0.5, 0.1);
}

function renderInstanced(t) {
  let n = 0;
  for (const b of eBullets) {
    if (n >= EB_MAX) break;
    const X = wx(b.x), Z = wz(b.y), r = b.r * S;
    setInst(ebShell, n, X, 0.3, Z, r);
    setInst(ebCore, n, X, 0.3, Z, r * 0.55);
    setInst(ebHalo, n, X, 0.3, Z, r * (1.7 + Math.sin(t * 12 + n) * 0.15));
    n++;
  }
  for (const m of [ebShell, ebCore, ebHalo]) { m.count = n; m.instanceMatrix.needsUpdate = true; }
  n = 0;
  for (const p of particles) {
    if (n >= PMAX) break;
    const k = Math.max(0, p.life / p.max);
    setInst(partMesh, n, wx(p.x), p.h ?? 0.3, wz(p.y), p.r * S * (0.3 + 0.9 * k), p.life * 7);
    partMesh.setColorAt(n, col(p.color));
    n++;
  }
  partMesh.count = n; partMesh.instanceMatrix.needsUpdate = true;
  if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
}

function render(dt, t) {
  const frozen = state === 'pause' || state === 'pick';
  if (!frozen) {
    updateEnv(dt, t);
    const target = state === 'start' ? (Math.floor(t / 3.4) % 2) : (mechT > 0 ? 1 : 0);
    morph = clamp(morph + (target ? 1 : -1) * dt / 0.75, 0, 1);
  }
  poolsBegin();
  renderPlayer(frozen ? 0.0001 : dt, t);
  if (state !== 'start') {
    for (const e of enemies) renderEnemy(e, t);
    for (const b of bullets) renderBullet(b);
    for (const it of items) renderItem(it, t);
    for (const r of rings) renderRing(r);
    for (const b of bolts) renderBolt(b);
  }
  renderInstanced(t);
  poolsEnd();

  // 카메라 흔들림
  if (!frozen) shake = Math.max(0, shake - dt * 1.8);
  const sk = shake * shake * 0.9;
  camera.position.set(camBase.x + rand(-sk, sk), camBase.y + rand(-sk, sk), camBase.z + rand(-sk, sk));
  camera.lookAt(camTarget.x + rand(-sk, sk) * 0.5, camTarget.y, camTarget.z);
  if (hurtA > 0) { hurtA = Math.max(0, hurtA - dt * 2.2); }
  $('hurt').style.opacity = hurtA;
  renderer.render(scene, camera);
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  try {
    if (state !== 'pause' && state !== 'pick') update(dt);
    render(dt, now / 1000);
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

// ---------- 화면 ----------
const SCREENS = ['startScreen', 'pauseScreen', 'overScreen', 'pickScreen', 'codexScreen'];
function show(id) {
  for (const s of SCREENS) $(s).classList.toggle('hidden', s !== id);
  const inGame = state !== 'start';
  $('hud').classList.toggle('hidden', !inGame || id === 'codexScreen');
  $('podHud').classList.toggle('hidden', !inGame || id !== null);
  $('tfBtn').classList.toggle('hidden', !inGame || id !== null);
}
function start() {
  reset(); firstPick = true;
  state = 'play';
  openPick();
}
function pause() {
  if (state === 'play') {
    state = 'pause'; touchId = null;
    $('pauseBuild').innerHTML = buildHtml();
    show('pauseScreen');
  }
}
function resume() { state = 'play'; show(null); }
function gameOver() {
  state = 'over';
  mechT = 0;
  explode(player.x, player.y, '#ff7a2f', 50);
  rings.push({ x: player.x, y: player.y, r: 0, max: 90, t: 0, color: '#ffb340' });
  shake = 1;
  if (score > best) { best = score; store.set(KEY, best); $('bestOver').textContent = '🏆 새 최고 기록!'; }
  else $('bestOver').textContent = '최고 기록 ' + best;
  $('finalScore').textContent = score;
  $('finalLevel').textContent = level;
  $('overBuild').innerHTML = '이번 빌드<br>' + buildHtml();
  setTimeout(() => { if (state === 'over') show('overScreen'); }, 900);
}

let codexReturn = 'startScreen';
function openCodex(from) {
  codexReturn = from;
  $('codexCount').textContent = `발견한 조합 ${COMBO_KEYS.filter(k => found.has(k)).length} / ${COMBO_KEYS.length}`;
  $('codexList').innerHTML = COMBO_KEYS.map(k => found.has(k)
    ? `<div class="cx"><div class="r">${keyIcons(k)}</div><div class="n">${MS[k].name}</div><div class="d">${MS[k].desc}</div></div>`
    : `<div class="cx lock"><div class="r">❓❓</div><div class="n">???</div><div class="d">아직 발견하지 못한 조합</div></div>`).join('');
  show('codexScreen');
}

$('startBtn').onclick = start;
$('retryBtn').onclick = start;
$('resumeBtn').onclick = resume;
$('pauseBtn').onclick = pause;
$('codexBtn').onclick = () => openCodex('startScreen');
$('overCodex').onclick = () => openCodex('overScreen');
$('codexBack').onclick = () => show(codexReturn);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
$('bestStart').textContent = best ? '최고 기록 ' + best : '';

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  fitCamera();
  if (state === 'start') player = { x: W / 2, y: H * 0.8, r: 18 };
  else { player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 80, H - 50); }
}
resize();
for (const c of clouds) placeCloud(c, true);
renderPodHud();
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
